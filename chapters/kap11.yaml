# KAPITEL 11 — Kroppen
# Anatomy tour with special plurals; modals II (måste, får inte, behöver);
# har ont i; känner sig. Oskar's test-day illness fools nobody.

kapitel: 11
titel: "Kroppen"
arc: B
grammatik_fokus: "måste, får (inte), behöver; har ont i + kroppsdel; känner sig; ögon/öron/händer/fötter"
uttal_fokus: "lång och kort vokal i kroppens ord: ben — hand, fot — kropp"

fokus: [kropp, huvud, mage, hand, arm, ben, fot, öga, öra, sjuk, frisk, läkare]
stretch: [mun, näsa, hår, feber]

illustration: >-
  Split scene: left, a friendly labeled anatomy poster in children's-book
  style (a running child with lines to huvud, öga, öra, näsa, mun, arm, hand,
  mage, ben, fot); right, Oskar theatrically "ill" in bed with a blanket to
  his chin while Karin — doctor's calm, one eyebrow raised — holds a
  thermometer that clearly reads normal; the grey cat asleep on Oskar's legs;
  through the window, children walking to school. Watercolor.

lasstycken:
  - rubrik: "I. EN MÄNNISKAS KROPP"
    block:
      - typ: narration
        text: >-
          En människa har en kropp. Vad har kroppen? Ett huvud! På huvudet
          finns hår, två ögon, två öron, en näsa och en mun. Med ögonen
          ser du. Med öronen hör du. Med munnen äter du och talar du. Och
          näsan? Den är mellan ögonen och munnen!
        margin:
          - "en kropp 🧍"
          - "ett öga — två ÖGON 👀"
          - "ett öra — två ÖRON 👂"
          - "en mun 👄 · en näsa 👃 · hår 💇"

      - typ: narration
        text: >-
          Kroppen har också två armar och två ben. På armen finns en hand:
          två armar, två händer! Med händerna tar du saker. På benet finns
          en fot: två ben, två fötter. Med fötterna går och springer du.
          Hur många ögon har en människa? Två. Hur många fötter? Två. Och
          hur många ben har Ludde? Fyra!
        margin:
          - "en hand — två HÄNDER (a → ä!)"
          - "en fot — två FÖTTER (o → ö!)"
          - "en arm — armar 💪 · ett ben — ben 🦵"

      - typ: narration
        text: >-
          Är kroppen bra? Då är du frisk: du kan springa, leka och gå till
          skolan. Har du ont i huvudet eller i magen? Då är du sjuk. Sjuka
          människor behöver en läkare! En läkare ser på kroppen och
          frågar: – Var har du ont? Karin Berg är läkare: sjuka människor
          i Sjövik kommer till henne.
        margin:
          - "frisk 💪 ↔ sjuk 🤒"
          - "har ont i X = X är inte bra! 😖"
          - "en läkare 🩺"
          - "behöver = måste ha"

  - rubrik: "II. OSKAR ÄR SJUK — ELLER?"
    block:
      - typ: narration
        text: >-
          Det är morgon. Barnen måste gå till skolan — men Oskar ligger i
          sängen och ropar:
        margin:
          - "måste = 💯 inget val!"

      - typ: dialogue
        speaker: Oskar
        text: "Mamma! Jag är sjuk! Jag har ont i huvudet … och i magen … och i benen!"

      - typ: dialogue
        speaker: Karin
        text: "Känner du dig sjuk? Kom, jag ser på dig."

      - typ: narration
        text: >-
          Karin kommer till sängen. Hon är läkare — och hon är mamma! Hon
          ser på Oskars ögon, på öronen och i munnen. Hon känner på hans
          huvud med handen. Har Oskar feber? Nej — ingen feber: huvudet är
          bra.
        margin:
          - "känner på = 🖐 tar på"
          - "feber 🌡 = kroppen är mycket varm"

      - typ: dialogue
        speaker: Karin
        text: >-
          Du har inte feber. Men du har ont, säger du — då är du sjuk, och
          sjuka pojkar måste vara i sängen. Du får inte leka, du får inte
          gå ut, och du får inte äta godis. Sjuka pojkar behöver sova!
        margin:
          - "får inte = ✗ förbjudet!"

      - typ: narration
        text: >-
          Oskar ligger i sängen. Han sover inte — han är inte trött! Han
          hör Astrid och Nils: de går till skolan. Han ser ut genom
          fönstret. Misse kommer och lägger sig på honom. Oskar ligger och
          ligger. Han vill leka. Han vill äta godis. Men sjuka pojkar
          måste vara i sängen …
        margin:
          - "🛏 … en lång, lång morgon"

      - typ: narration
        text: >-
          När barnen kommer hem från skolan, springer Oskar ner till
          köket: – Mamma! Jag är frisk nu! Jag har inte ont — jag kan
          leka! Karin ser på honom. – Så bra! säger hon. Friska pojkar kan
          leka … och friska pojkar går till skolan. Nils skrattar. Oskar
          svarar inte.
        margin:
          - "frisk nu! 😇 … mamma ser allt 👀"

  - rubrik: "III. FRISK OCH SJUK"
    block:
      - typ: narration
        text: >-
          Hur många ögon har en människa? Två ögon — och två öron, två
          armar och två fötter. Vad gör du med öronen? Du hör. Var har
          Oskar ont? I huvudet och i magen — säger han! Har han feber?
          Nej. Är han sjuk? Han säger det! Vad får sjuka pojkar
          inte göra? De får inte leka, och de får inte äta godis. Vem är
          läkare i familjen? Karin. Och är Oskar frisk på kvällen? Ja —
          mycket frisk!
        margin:
          - "frågar → svarar"

      - typ: narration
        text: >-
          Oskar är frisk, och alla är glada. Och kapitel tolv? Det är ett
          år i Sverige!
        margin:
          - "🔍 ett år …?"

grammatik:
  - rubrik: "måste, får inte, behöver"
    forklaring: >-
      Måste = du har inget val! Får inte = det är förbjudet! Behöver =
      måste ha. Alla tre + verb utan "att".
    tabell:
      head: ["", "exempel"]
      rows:
        - ["måste 💯", "Sjuka pojkar måste vara i sängen."]
        - ["får inte ✗", "Du får inte äta godis!"]
        - ["behöver", "Sjuka barn behöver sova."]

  - rubrik: "har ont i"
    forklaring: >-
      – Var har du ont? – Jag har ont i huvudet! Ont i magen, ont i
      benen, ont i örat …
    tabell:
      head: ["", ""]
      rows:
        - ["Jag har ont i huvudet.", "Har du ont i magen?"]
        - ["Oskar har ont — säger han!", "Var har du ont?"]

  - rubrik: "känner sig"
    forklaring: >-
      Känner du dig sjuk? — Ja, jag känner mig mycket sjuk! (Och: känner
      PÅ = tar på med handen.)
    tabell:
      head: ["", ""]
      rows:
        - ["jag känner mig sjuk", "vi känner oss trötta"]
        - ["känner du dig frisk?", "han känner sig bra"]

  - rubrik: "kroppens plural"
    forklaring: >-
      Ögon, öron, händer, fötter — kroppens ord har sina egna former!
    tabell:
      head: ["singular", "plural", "bestämd plural"]
      rows:
        - ["ett öga", "två ögon", "ögonen"]
        - ["ett öra", "två öron", "öronen"]
        - ["en hand", "två händer", "händerna"]
        - ["en fot", "två fötter", "fötterna"]
        - ["en arm", "två armar", "armarna"]
        - ["ett ben", "två ben", "benen"]

uttal:
  rubrik: "Lång och kort vokal i kroppen"
  forklaring: >-
    Ben har lång e — hand har kort a! En vokal + två konsonanter = kort.
    Lyssna! 👂🔊
  grupper:
    - namn: "lång vokal"
      ord: [ben, fot, hår, mage]
    - namn: "kort vokal"
      ord: [hand, arm, mun, kropp]

