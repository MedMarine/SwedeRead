  A:
    instruktion: "Skriv plural — och måste/får/behöver, mig/dig/sig."
    items:
      - q: "ett öga — två {ögon}"
      - q: "ett öra — två {öron}"
      - q: "en hand — två {händer}"
      - q: "en fot — två {fötter}"
      - q: "en arm — två {armar}"
      - q: "ett ben — två {ben}"
      - q: "Sjuka pojkar {måste} vara i sängen."
      - q: "Du {får} inte äta godis!"
      - q: "Sjuka barn {behöver} sova."
      - q: "Oskar har {ont} i huvudet — säger han!"
      - q: "Känner du {dig} sjuk?"
      - q: "Oskar känner {sig} frisk nu!"
  B:
    instruktion: "Skriv ordet: kropp, huvud, mage, hand, händer, arm, ben, fot, fötter, ögon, öron, mun, näsa, hår, sjuk, frisk, läkare, feber."
    items:
      - q: "Med {ögonen} ser du, och med {öronen} hör du."
      - q: "Med munnen äter och talar du — och {näsan} är mellan ögonen och munnen."
      - q: "Med {händerna} tar du saker."
      - q: "Med fötterna {springer} du."
      - q: "På huvudet finns {hår}."
      - q: "Maten går ner i {magen}."
      - q: "Karin är {läkare} — sjuka människor kommer till henne."
      - q: "Oskar säger: – Jag är {sjuk}!"
      - q: "Men han har ingen {feber}."
      - q: "På kvällen är Oskar {frisk} — mycket frisk!"
      - q: "En människas {kropp} har ett huvud, två armar och två ben."
      - q: "Jag har ont i {huvudet}!"
  C:
    instruktion: "Svara på frågorna. Skriv hela meningar!"
    items:
      - q: "Vad gör du med ögonen — och med öronen?"
        model: "Med ögonen ser jag, och med öronen hör jag."
      - q: "Hur många ben har Ludde?"
        model: "Han har fyra ben!"
      - q: "Var har Oskar ont — säger han?"
        model: "Han säger: i huvudet, i magen och i benen."
      - q: "Har Oskar feber?"
        model: "Nej, han har ingen feber — huvudet är bra."
      - q: "Vad får sjuka pojkar inte göra?"
        model: "De får inte leka, inte gå ut och inte äta godis."
      - q: "Vad behöver sjuka barn göra?"
        model: "De behöver sova."
      - q: "Är Oskar sjuk på kvällen?"
        model: "Nej, då känner han sig frisk — mycket frisk!"

repetition:
  rubrik: "Ludde på tre ben"
  block:
    - typ: narration
      text: >-
          Ludde kommer på tre ben! Han har ont i en fot. – Är hunden sjuk?
          frågar Astrid. Karin är läkare — också hundens läkare, säger Astrid!
          Mamma ser på foten och känner på den med händerna. Där finns
          något — en mycket liten sak. Karin tar den från foten. – Nu är
          foten bra! Ludde får mat och vatten, och Misse ser på dem. Katter
          har inte ont — säger Misses ögon. På kvällen springer Ludde på
          fyra ben: han är frisk! – Bra, säger Astrid. En frisk hund har
          fyra ben, två öron, två ögon och en mage. Och min mamma är barnens läkare — och hundens!
