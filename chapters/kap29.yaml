# KAPITEL 29 — Man ska inte ge upp
# Generic man; morfar's proverbs tested against the summer; både/varken/
# antingen; ju … desto — and Lasse stops waiting.

kapitel: 29
titel: "Man ska inte ge upp"
arc: E
grammatik_fokus: "generellt man (man ska inte ge upp!); ordspråk; både…och, varken…eller, antingen…eller; ju…desto"
uttal_fokus: "ordspråkens rytm — korta ord, stor sanning"

fokus: [ordspråk, betyda, öva, försöka, lyckas, misslyckas, sanning, tålamod, råd, viktig]
stretch: [mod, värd]

illustration: >-
  Golden evening on morfar's porch after the storm: the old farmer in his
  chair mid-proverb, one finger raised, children cross-legged at his feet;
  around him small thought-vignettes of the summer — the boat turning, the
  boy with wings, a piggy bank; and down at the shore, small in the light,
  a young man and woman by the water, and the tiniest glint of a ring.
  Watercolor, long shadows, bright northern dusk.

lasstycken:
  - rubrik: "I. MORFARS ORDSPRÅK"
    block:
      - typ: narration
        text: >-
          Efter äventyret på sjön sitter alla framför morfars hus i den
          varma, ljusa kvällen. – I dag lärde ni er något, säger
          morfar. Vet ni vad? – Att segla? säger Nils. – Att vända,
          säger morfar. Den som är klok vänder i tid. Det är nästan ett
          ordspråk. Ett ordspråk är en liten, liten berättelse: bara en
          mening — men i meningen bor en stor sanning.
        margin:
          - "ett ordspråk = en mening med en stor sanning i!"
          - "en sanning = det som är sant"
          - "vänder i tid ↩⏰"

      - typ: narration
        text: >-
          Morfar talar ofta med ordet "man". Man ska inte ge upp. Man
          vet aldrig. Man lär sig varje dag. Vem är "man"? Alla! Du och
          jag och alla människor. När morfar säger "man ska inte ge
          upp", menar han: ingen ska ge upp — inte du, inte jag, ingen.
        margin:
          - "MAN = alla människor (du + jag + alla!)"
          - "ge upp = sluta försöka ✗"

      - typ: narration
        text: >-
          – Säg ett ordspråk till! säger Astrid. Morfar tänker. – Borta
          bra, men hemma bäst. – Vad betyder det? – Vad tror du? Astrid
          tänker på Stockholm … och på huset vid sjön. – Att det är bra
          att resa — men bäst att komma hem! – Precis, säger morfar. Och
          ni kom hem i dag — från ön! Alla skrattar.
        margin:
          - "betyder = vad ordet vill säga"
          - "Borta bra, men hemma bäst 🏠"

      - typ: narration
        text: >-
          – Och det här, säger morfar: Ju mer man övar, desto bättre
          blir man. Nils förstår: – Som Fågel-Pelle! Han försökte och
          föll, försökte och föll — och till slut lyckades han! – Ja,
          säger morfar. Den som aldrig försöker, misslyckas aldrig — men
          lyckas aldrig! Att misslyckas är inte farligt. Att ge upp —
          det är farligt. Man behöver mod — mod och tålamod. Och
          tålamod är guld värt. – Vad betyder DET? frågar Astrid. – Öva,
          öva, öva, säger morfar. Och vänta!
        margin:
          - "ju mer …, desto bättre!"
          - "övar 🔁 → blir bättre"
          - "lyckas ✓ ↔ misslyckas ✗ (båda har -s!)"
          - "mod 💪 + tålamod ⏳"
          - "guld värt = mer värt än guld!"

      - typ: narration
        text: >-
          – Är ordspråk sanna? frågar Nils. – Både ja och nej, säger
          morfar. Ett ordspråk är varken alltid sant eller alltid fel.
          Det är ett råd — ett gott råd från gamla människor till unga.
          Antingen lyssnar man på rådet, eller så lär man sig själv —
          och det tar längre tid! Både morfar och farmor har många råd,
          och de är viktiga: gamla människor har sett mycket, och i
          varje gott råd bor en liten sanning. Råd är viktiga — och
          tålamod är viktigast av allt!
        margin:
          - "både A och B = A + B"
          - "varken A eller B = inte A, inte B"
          - "antingen A eller B = en av två"
          - "ett råd = kloka ord: 'gör så!'"
          - "viktig = stor för hjärtat och huvudet"

  - rubrik: "II. LASSE LYSSNAR PÅ ETT RÅD"
    block:
      - typ: narration
        text: >-
          Då stiger Lasse upp. – Jag har lyssnat på ett råd i kväll,
          säger han. Man ska inte ge upp — och man ska inte vänta för
          länge! Sven, Anders … i kväll frågar jag Maria. Det blir
          tyst. Sedan säger morfar långsamt: – Den som väntar på något
          gott väntar aldrig för länge. Men gå nu, pojke! Och Lasse går
          — ner mot sjön, där Maria står i den ljusa kvällen.
        margin:
          - "😲🤫 (barnen VET om ringen!)"
          - "Den som väntar på något gott … ❤"

      - typ: narration
        text: >-
          Familjen väntar framför huset. Ingen talar. Ludde är tyst.
          Efter en lång, lång tid — tjugo minuter, säger Nils; hundra
          år, säger Astrid — kommer två människor upp från sjön. De går
          hand i hand, och Maria har något på handen som inte var där
          före kvällen: en ring! – JA! ropar Astrid. Hon sa JA! Alla
          ropar hurra, Ludde skäller, och det blir en stor, glad kväll
          på gården. Lasse och Maria är förlovade!
        margin:
          - "hand i hand ❤"
          - "– Hon sa JA! 💍🎉"

  - rubrik: "III. STORA SANNINGAR"
    block:
      - typ: narration
        text: >-
          Vad är ett ordspråk? En mening med en stor sanning i. Vad
          betyder "borta bra, men hemma bäst"? Att det är bra att resa —
          men bäst att komma hem. Vad behöver den som övar? Mod och
          tålamod! Lyckas man alltid? Nej — man misslyckas också, och
          det är inte farligt. Men den som aldrig försöker, lyckas
          aldrig. Vad är viktigt? Att försöka! Gav Lasse upp? Nej! Han frågade Maria, och hon
          sa ja: nu är de förlovade. Och vad kommer efter förlovad? Det
          största av allt — och alla är bjudna! Det är kapitel trettio.
        margin:
          - "🔍 det största av allt …?"

grammatik:
  - rubrik: "man"
    forklaring: >-
      Man = alla människor, du och jag! Man ska inte ge upp. Man vet
      aldrig. I affären säger man "tack". OBS: "man" (alla) och "en man"
      (↔ kvinna) är två ord!
    tabell:
      head: ["", ""]
      rows:
        - ["Man ska inte ge upp.", "= ingen ska ge upp!"]
        - ["Man äter sill på midsommar.", "= alla gör det!"]
        - ["Vad säger man?", "= vad säger folk?"]

  - rubrik: "både, varken, antingen"
    forklaring: >-
      Både A och B = A + B. Varken A eller B = inte A, inte B! Antingen
      A eller B = en av två.
    tabell:
      head: ["", "exempel"]
      rows:
        - ["både … och", "Både morfar och farmor har många råd."]
        - ["varken … eller", "Ordspråk är varken alltid sanna eller alltid fel."]
        - ["antingen … eller", "Antingen lyssnar man — eller lär man sig själv!"]

  - rubrik: "ju … desto"
    forklaring: >-
      Mer av A ger mer av B! Ju mer man övar, desto bättre blir man.
    tabell:
      head: ["", ""]
      rows:
        - ["Ju mer man övar,", "desto bättre blir man."]
        - ["Ju äldre man blir,", "desto mer förstår man."]
        - ["Ju längre man väntar,", "desto bättre blir bullarna? Nej!"]

  - rubrik: "ordspråk att minnas"
    forklaring: >-
      Fyra ordspråk från den här boken — de är dina nu!
    tabell:
      head: ["ordspråk", "= sanningen"]
      rows:
        - ["Man ska inte ge upp.", "försök igen!"]
        - ["Borta bra, men hemma bäst.", "res — och kom hem!"]
        - ["Ju mer man övar, desto bättre blir man.", "öva! 🔁"]
        - ["Den som väntar på något gott väntar aldrig för länge.", "tålamod ⏳❤"]

uttal:
  rubrik: "Ordspråkens rytm"
  forklaring: >-
    Ordspråk har melodi — korta ord, stor rytm: BORta BRA, men HEMma
    BÄST. Lyssna — och säg dem själv! 👂🎵
  grupper:
    - namn: "ordspråk"
      ord: ["Borta bra, men hemma bäst.", "Man ska inte ge upp."]
    - namn: "-s-verb"
      ord: [lyckas, misslyckas, minns]

