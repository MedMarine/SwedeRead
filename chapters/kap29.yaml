repetition:
  rubrik: "Nils skriver om äventyret"
  block:
    - typ: narration
      text: >-
          Nils skriver om äventyret i sin bok: "Vi seglade ut på morgonen.
          Vinden var god, och seglet var vitt mot den blåa himlen. Men
          plötsligt ökade vinden, och vågorna blev höga. Vi ville vända —
          men det gick inte: vinden stod mot oss. Vi seglade till en liten
          ö. Där väntade vi på stranden, säkra men våta. Vi tog ner seglet från masten,
          och jag höll det. Alla hade flytvästar — därför var vi säkra.
          Sjön är djup, sa Lasse, men den som har flytväst och tålamod
          kommer hem. Och vi kom hem!" Nils läser för familjen. – Bra
          berättat! säger morfar. – En sak är fel, säger Oskar. Vågorna var
          höga som HUS. – De var höga, skriver Nils. Det är sant — och sant
          är bäst.
