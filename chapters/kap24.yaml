# KAPITEL 24 — Den sjuka pojken
# Pluskvamperfekt (hade + supinum); medan/innan; bli. Nils — who never
# fakes — is truly ill: a night vigil in layered past tenses, and the
# fever dream of the living map.

kapitel: 24
titel: "Den sjuka pojken"
arc: D
grammatik_fokus: "pluskvamperfekt (hade varit, hade regnat); tidsbisatser med när/medan/innan; bli (frisk → sjuk!)"
uttal_fokus: "viskad prosodi — läsning i sjukrummet, tyst och lugnt"

fokus: [bli, hosta, hals, medicin, termometer, filt, kudde, vila, orolig, dröm, drömma]
stretch: [sked, mörk, somna]

illustration: >-
  Night vigil in soft blues: Nils flushed and asleep under a heavy blanket,
  thermometer on the nightstand beside a medicine bottle and spoon; Karin in
  a chair by the bed, awake, hand on his forehead, a small lamp glowing;
  above the sleeping boy, a dream cloud — a living map of Sweden with wet
  blue lakes, a tiny train crossing the paper, and a great moose standing in
  Småland looking out at him. Outside the window, rain. Watercolor.

lasstycken:
  - rubrik: "I. NILS BLIR SJUK"
    block:
      - typ: narration
        text: >-
          Det hade regnat i tre dagar, och Nils hade varit ute vid sjön
          med Lasse — de hade tittat på båtar, och Nils hade inte haft
          något paraply. När han kom hem var han våt och kall, och nu, på
          kvällen, är han sjuk: han är varm, mycket varm, och han hostar.
        margin:
          - "HADE varit, HADE regnat = pluskvamperfekt (⏪ före ⏪!)"
          - "hostar: host, host! 😷"

      - typ: narration
        text: >-
          Karin kommer med termometern, för en termometer säger hur varm
          kroppen är. – Trettionio! säger mamma. Du har feber, Nils.
          Nils känner sig dålig: han har ont i huvudet och i halsen,
          han hostar och hostar, och när Karin tittar i hans hals ser
          hon att den är röd. Oskar var "sjuk" en morgon i kapitel elva — men Nils är
          sjuk nu, och alla vet det.
        margin:
          - "en termometer 🌡 (39 = feber!)"
          - "ont i halsen (halsen: mellan huvudet och kroppen)"

      - typ: narration
        text: >-
          I går var Nils frisk, men sedan blev han sjuk — och han blev
          sjuk därför att han hade varit våt och kall hela dagen. Att bli = från A till
          B: frisk → sjuk, torr → våt, liten → stor! Karin ger honom
          medicin på en sked. Medicinen är inte god — usch! — men sjuka
          barn behöver medicin. Nils får en stor filt och en god kudde.
          Han ligger i sängen under filten, med huvudet på kudden.
        margin:
          - "blir = A → B! (frisk → sjuk)"
          - "medicin 💊: inte god — men bra!"
          - "en sked 🥄 · en filt · en kudde"

  - rubrik: "II. NATTEN"
    block:
      - typ: narration
        text: >-
          Det blir natt, och natten är mörk. Innan Nils somnar dricker han litet varmt vatten, och medan han
          sedan sover sitter mamma vid sängen och är orolig — mammor är
          alltid oroliga när barnen är sjuka, och en läkare vet att feber
          kan bli farlig. Klockan tolv känner hon på hans huvud: varmt. Klockan
          två: varmt. Huset är tyst och mörkt, och alla sover — men inte
          Karin.
        margin:
          - "innan = FÖRE i tiden"
          - "medan = i SAMMA tid"
          - "somnar 😴 ↔ vaknar"
          - "orolig 😟 = 'är allt bra?!'"
          - "mörk 🌑 ↔ ljus"

      - typ: narration
        text: >-
          Nils drömmer, och i drömmen ser han en stor karta — Sveriges
          karta, kartan som han hade haft på tåget — men nu är kartan
          levande: sjöarna är blåa och våta, tågen åker över
          papperet, och en stor älg står i Småland och ser på honom. –
          Var ligger Sjövik? frågar älgen. Nils vill svara, men i
          drömmen kan han inte tala … Älgen väntar och väntar … men då kommer Ludde in i drömmen och
          skäller, och älgen går sin väg.
        margin:
          - "drömmer 🌙 (en dröm — drömmen!)"
          - "levande = den lever!"
          - "kartan från kapitel nitton — nu levande!"

      - typ: narration
        text: >-
          När Nils vaknar på morgonen känner han sig … bra! Mamma känner på
          hans huvud: det är inte varmt. Termometern säger trettiosju —
          febern är borta! – Du hade feber i natt, säger Karin, men nu
          är den borta. Du måste vila i dag och i morgon — men du blir
          frisk. I dörren står Oskar, som har varit orolig hela natten — och nu
          ger han Nils något: sitt godis! – Du är sjuk, säger
          Oskar. Du behöver det. Nils ligger på sin kudde och skrattar …
          och hostar … och skrattar igen.
        margin:
          - "vila = ligga och sova, inte springa!"
          - "trettiosju = 37: ingen feber ✓"
          - "Oskar ger sitt godis!! ❤"

  - rubrik: "III. FÖRE OCH EFTER"
    block:
      - typ: narration
        text: >-
          Varför blev Nils sjuk? Därför att han hade varit ute i regnet
          — våt och kall hela dagen. Vad hade han inte haft? Paraply!
          Var hade han ont? I huvudet och i halsen. Vad fick han på en
          sked? Medicin — usch! Vad gjorde Karin medan Nils sov? Hon
          satt vid sängen och var orolig. Vad drömde Nils? Han drömde om
          en levande karta — och om en älg som frågade om Sjövik. En
          dröm är bara en dröm, men Nils berättar om drömmen hela dagen!
          Vad sa termometern på morgonen? Trettiosju. Nu vilar Nils i
          två dagar under sin filt, och sedan blir han frisk igen.
        margin:
          - "hade varit ⏪⏪ → blev sjuk ⏪ → är frisk 📍"

      - typ: narration
        text: >-
          Nils vilar i sängen, och alla är snälla. Astrid sitter hos
          honom. – Berätta något! säger Nils. – Jag? säger Astrid. Nej —
          mamma berättar! På kvällen kommer Karin med något som barnen
          älskar: en berättelse från för länge sedan. Det är kapitel
          tjugofem!
        margin:
          - "🔍 en berättelse från för länge sedan …?"

grammatik:
  - rubrik: "pluskvamperfekt: hade + supinum"
    forklaring: >-
      Perfekt: han HAR varit våt (→ nu). Pluskvamperfekt: han HADE varit
      våt (→ då, före något annat!). Nils blev sjuk därför att han HADE
      varit våt.
    tabell:
      head: ["perfekt (→ nu)", "pluskvamperfekt (→ då)"]
      rows:
        - ["Han har varit våt.", "Han hade varit våt (i går)."]
        - ["Det har regnat.", "Det hade regnat i tre dagar."]
        - ["Han har inte haft paraply.", "Han hade inte haft paraply."]

  - rubrik: "när, medan, innan"
    forklaring: >-
      Tre små tidsord! När = i den tiden. Medan = i samma tid. Innan =
      före i tiden.
    tabell:
      head: ["", "exempel"]
      rows:
        - ["när", "När barnen är sjuka, är mamma orolig."]
        - ["medan", "Medan han sover, sitter mamma vid sängen."]
        - ["innan", "Innan han somnar, dricker han vatten."]

  - rubrik: "bli"
    forklaring: >-
      Bli = från A till B! I går var Nils frisk. Han blev sjuk. Nu blir
      han frisk igen. Barn blir stora, dagar blir korta — allt blir!
    tabell:
      head: ["", ""]
      rows:
        - ["frisk → sjuk", "Nils blev sjuk i natt."]
        - ["sjuk → frisk", "Han blir frisk igen!"]
        - ["dag → natt", "Det blir natt — och mörkt."]

  - rubrik: "det sjuka barnets ord"
    forklaring: >-
      Feber, hosta, ont i halsen — och vad man behöver: termometer,
      medicin, filt, kudde och vila!
    tabell:
      head: ["", ""]
      rows:
        - ["🌡 termometern", "39 = feber, 37 = ingen feber"]
        - ["💊 medicin på en sked", "usch — men bra!"]
        - ["filt + kudde", "varm och god i sängen"]
        - ["vila", "ligga och sova — och bli frisk!"]

uttal:
  rubrik: "Tyst och lugnt — sjukrummets röst"
  forklaring: >-
    Läs det här tyst och långsamt, som vid en säng där någon sover:
    "Huset är tyst och mörkt." Lyssna på den lugna rösten! 👂🌙
  grupper:
    - namn: "tyst röst"
      ord: ["Huset är tyst.", "Alla sover.", "Var lugn."]
    - namn: "sjukrummets ord"
      ord: [feber, medicin, termometer, filt]

