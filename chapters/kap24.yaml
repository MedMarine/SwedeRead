repetition:
  rubrik: "Marias brev"
  block:
    - typ: narration
      text: >-
          Ett brev kom till Lasse — från Maria. "Jag saknar dig! Stockholm
          är stort, men jag längtar efter dig och efter Sjövik. När träffar
          jag din familj? Snart, säger du — men snart är långt borta …"
          Lasse läste brevet många gånger. Han satt vid fönstret och tänkte
          på henne. – Saknar du henne? frågade Astrid. – Ja, sa Lasse. När
          man älskar någon, är hjärtat där hon är. – Då är ditt hjärta i
          Stockholm! sa Astrid. – Ja, sa Lasse och skrattade. Just där! Och
          den kvällen somnade han med brevet i handen och drömde om fartyg
          — och om Maria.
