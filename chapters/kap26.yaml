      - q: "Flög Pelle igen efter den stora flygturen?"
        model: "Nej, aldrig — vingarna var sönder, och han byggde inga nya."
      - q: "Vem var pojken i sagan?"
        model: "Morfars morfar — Fågel-Pelle!"

repetition:
  rubrik: "Barnen leker sagan"
  block:
    - typ: narration
      text: >-
          Barnen leker sagan i trädgården: Elsa är prinsessan, Oskar är
          trollet, och Nils är kungen. Björken är berget! – Min dotter har
          försvunnit! ropar kungen. Prinsessan vandrar genom "skogen" —
          genom trädgården — och trollet sitter bakom björken med sitt
          guld: tre gula bollar. – Vad vill du ha, lilla människa? säger
          trollet långsamt. – En vän! svarar prinsessan. Men Oskar vill
          vara ett farligt troll: – NEJ! GULD! – Du gör det fel, säger
          Elsa. Trollet är snällt! – MITT troll är farligt! Och nu bråkar
          trollet och prinsessan … Då säger kungen: – I sagan blir de
          vänner. Det är det som är sagan! – Och finns det björnar i
          skogen? frågar trollet. – Nej, säger kungen. Bara en räv — och
          en björn bor långt, långt borta! De provar igen, och nu är det
          spännande — och sagan slutar rätt: trollet får en vän. Ludde är
          också med: han är trollets hund.
