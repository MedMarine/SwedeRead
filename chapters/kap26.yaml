  C:
    instruktion: "Svara på frågorna. Skriv hela meningar!"
    items:
      - q: "Vad kallades Pelle i staden — och varför?"
        model: "Han kallades Fågel-Pelle, därför att han ville flyga som fåglarna."
      - q: "Vad byggdes vingarna av?"
        model: "De byggdes av ljust trä och hundra fjädrar."
      - q: "Vad sa den kloka kvinnan?"
        model: "Hon varnade honom: flyg inte för högt, och flyg inte för lågt!"
      - q: "Vad hände de första gångerna Pelle provade?"
        model: "Han föll — men han provade igen, och tredje gången flög han!"
      - q: "Varför gick Pelle ner när han flög över träden?"
