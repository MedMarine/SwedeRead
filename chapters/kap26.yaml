# KAPITEL 26 — Pojken som ville flyga
# Morfar's original tale: a northern flying-boy who listens to the warning
# and lives. Passive -s (kallades, byggdes, det sägs); skulle.

kapitel: 26
titel: "Pojken som ville flyga"
arc: E
grammatik_fokus: "passiv på -s (kallades, byggdes, det sägs att …); skulle ('ska' i preteritum)"
uttal_fokus: "passivens -s mot genitivens -s: kallas — Pelles"

fokus: [vinge, fjäder, bygga, kalla, falla, varna, lyssna, modig, prova]
stretch: [örn, luft]

illustration: >-
  Morfar's tale in warm sepia and sky-blue: a boy on a green mountainside
  wearing two great homemade wings of pale wood and hundreds of feathers,
  mid-leap into the wind; below, a small town of red roofs, farms and a
  lake; a wise old woman small in the corner, one finger raised; an eagle
  wheeling above him at a respectful distance. Inset frame: morfar telling
  it, the children open-mouthed. Watercolor.

lasstycken:
  - rubrik: "I. FÅGEL-PELLE"
    block:
      - typ: narration
        text: >-
          Nästa kväll sitter morfar i det stora rummet. – Nu berättar
          JAG, säger han. Mammas saga var fin — men min är sann! – Sann?
          säger Nils. – Kanske, säger morfar och skrattar. Lyssna nu.
          Det var en gång, för länge, länge sedan …
        margin:
          - "morfar berättar — och sagan är sann? 🤔"
          - "Lyssna! 👂"

      - typ: narration
        text: >-
          I en liten stad vid ett stort berg bodde en pojke som hette
          Pelle och som älskade fåglar mer än allt annat: varje dag
          tittade han på hur de flög över berget och ner mot sjön. – Människor kan inte
          flyga, sa alla. Men Pelle sa: – Jag ska flyga. En dag ska jag
          flyga! Folk skrattade, och pojken kallades "Fågel-Pelle" i
          hela staden.
        margin:
          - "kallades = folk sa så om honom! (passiv -s)"
          - "mot sjön = i riktning → sjön"

      - typ: narration
        text: >-
          Pelle började bygga vingar. En vinge, två vingar — som en
          fågel har! Vingarna byggdes av ljust trä och hundra fjädrar — stora fjädrar
          från örnar och små från hönor — som Pelle hittade i skogen och
          på gårdarna. Han byggde och byggde, hela vintern och hela våren,
          och det sades i staden att
          Fågel-Pelle var dum. Men Pelle lyssnade inte på det.
        margin:
          - "en vinge — två vingar 🪽"
          - "en fjäder 🪶 — fjädrar"
          - "byggdes av = man byggde den av …"
          - "en örn 🦅 = en stor, stark fågel"
          - "det sades att … = folk sa att …"

      - typ: narration
        text: >-
          I staden bodde en gammal klok kvinna. Hon varnade honom: – Du
          ska flyga, pojke, det ser jag. Men lyssna nu: flyg inte för
          högt — över berget är vinden för stark. Och flyg inte för lågt
          — över sjön blir fjädrarna våta och tunga. Inte för högt, inte
          för lågt. Kan du minnas det? – Ja, sa Pelle. Och han var klok:
          han lyssnade — och han mindes.
        margin:
          - "varnade ⚠ = sa 'akta dig!' före det hände"
          - "för högt = mer än bra är!"
          - "inte för högt, inte för lågt!"

  - rubrik: "II. FLYGTUREN"
    block:
      - typ: narration
        text: >-
          Först provade Pelle från ett litet berg. Han sprang, vingarna
          tog vinden — och Pelle föll! Han föll ner i gräset och
          skrattade. Han provade igen … och föll igen. Men tredje gången
          föll han inte: han flög! Tre steg över gräset — som en stor,
          långsam höna. Folk skrattade, men Pelle var glad: han hade
          flugit!
        margin:
          - "provar 🔬 = gör det och ser: går det?"
          - "faller ⬇ (föll — har fallit)"
          - "tre steg — men han FLÖG!"

      - typ: narration
        text: >-
          En morgon i juni, när vinden var god och himlen blå, steg Pelle
          upp på det stora berget. Han hade sagt till alla att han
          skulle flyga från berget den dagen — och nu stod han där. Han
          sprang — och vingarna tog honom! Pelle flög! Han flög över
          träden, över gårdarna, mot sjön, högre och högre upp i luften.
          Han var modig — men var han för modig? Just när vinden över
          honom blev stark och kall mindes han den kloka kvinnan: inte för
          högt! Pelle var modig OCH klok: han gick ner, lägre och lägre,
          och till slut föll han långsamt ner i det varma gräset vid
          sjön. Vingarna var sönder — men Pelle levde, och han skrattade
          mot himlen.
        margin:
          - "skulle = 'ska' i preteritum! (han sa att han SKULLE flyga)"
          - "modig 💪 — men för modig?"
          - "luften = fåglarnas 'hav'!"
          - "modig OCH klok!"

      - typ: narration
        text: >-
          Pelle flög aldrig igen — vingarna var sönder, och han byggde
          inga nya. Men han sa alltid: – Människor kan inte flyga som
          fåglar. Men en pojke som lyssnar kan flyga litet — och leva!
          Morfar är tyst en liten tid. Sedan säger han: – Och den
          pojken, barn … den pojken var min morfar. – DIN morfar?! ropar
          barnen. – Ja. Min morfar — och han kallades Fågel-Pelle hela
          tiden, av alla. Det sägs att en vinge
          ligger på ett museum i Växjö. – Är det sant? frågar Nils.
          Morfar skrattar: – Det är en saga. Och sagor är litet sanna —
          alltid!
        margin:
          - "det sägs att … = folk säger att …"
          - "morfars morfar!! 😲"

  - rubrik: "III. DET SÄGS ATT …"
    block:
      - typ: narration
        text: >-
          Vad ville Pelle göra? Flyga! Vad kallades han i staden?
          Fågel-Pelle. Vad byggdes vingarna av? Ljust trä och hundra
          fjädrar — från örnar och hönor. Vem varnade honom? En gammal
          klok kvinna: inte för högt, inte för lågt! Föll Pelle? Ja,
          många gånger — men han provade igen. Flög han? Ja — över
          träden, högt upp i luften! Varför föll han inte i sjön? Därför
          att han lyssnade och mindes varningen. Var Pelle modig? Ja —
          modig och klok! Och vem var pojken? Morfars morfar!
        margin:
          - "kallades · byggdes · sades · sägs — passiv -s!"

      - typ: narration
        text: >-
          Två sagor på två kvällar! Men nu kommer något som inte är en
          saga: årets längsta och ljusaste dag. Det är kapitel tjugosju!
        margin:
          - "🔍 årets längsta dag …?"

grammatik:
  - rubrik: "passiv: -s"
    forklaring: >-
      Vem gjorde det? Vi vet inte — eller det är inte viktigt! Då får
      verbet -s: pojken kallades Fågel-Pelle (= folk kallade honom så).
      Vingarna byggdes av trä (= någon byggde dem).
    tabell:
      head: ["aktiv", "passiv (-s)"]
      rows:
        - ["Folk kallade honom Fågel-Pelle.", "Han kallades Fågel-Pelle."]
        - ["Pelle byggde vingarna av trä.", "Vingarna byggdes av trä."]
        - ["Folk sa att han var dum.", "Det sades att han var dum."]
        - ["Folk säger att …", "Det sägs att …"]

  - rubrik: "skulle"
    forklaring: >-
      Ska har ett preteritum: skulle! Han säger att han SKA flyga (nu →
      framtid). Han sa att han SKULLE flyga (då → framtid i dåtid).
    tabell:
      head: ["nu", "då"]
      rows:
        - ["Han säger att han ska flyga.", "Han sa att han skulle flyga."]
        - ["Jag ska resa i morgon.", "Jag visste att jag skulle resa."]

  - rubrik: "lyssna — och höra"
    forklaring: >-
      Höra = ljudet kommer till örat. Lyssna = du GER örat till ljudet!
      (Som se och titta: titta = se med fokus.)
    tabell:
      head: ["", ""]
      rows:
        - ["höra 👂", "Han hörde vinden."]
        - ["lyssna 👂❗", "Han lyssnade på den kloka kvinnan."]
        - ["se 👀", "Han såg fåglarna."]
        - ["titta 👀❗", "Han tittade på dem varje dag."]

  - rubrik: "modig — och klok"
    forklaring: >-
      Modig = vågar mycket. Klok = förstår mycket. Pelle var modig OCH
      klok: han flög — men han lyssnade på varningen!
    tabell:
      head: ["", ""]
      rows:
        - ["bara modig", "flyger för högt … och faller i sjön!"]
        - ["modig och klok", "flyger — och lever!"]

uttal:
  rubrik: "Passivens -s"
  forklaring: >-
    Kallas, byggdes, sägs — passivens -s sitter på verbet. Pelles,
    morfars — genitivens -s sitter på namnet! Lyssna! 👂🔊
  grupper:
    - namn: "passiv -s"
      ord: [kallas, kallades, byggdes, sägs]
    - namn: "genitiv -s"
      ord: [Pelles, morfars, stadens]

