# KAPITEL 9 — På morfars gård
# The farm: någon/något/några ↔ ingen/inget/inga; alla/varje; the lost-lamb
# mini-mystery; the får/får homograph, fully exploited.

kapitel: 9
titel: "På morfars gård"
arc: B
grammatik_fokus: "någon/något/några ↔ ingen/inget/inga; alla och varje; djurens plural"
uttal_fokus: "r + d/n/t smälter ihop: gård, barn, korna, borta"

fokus: [morfar, gård, djur, ko, häst, gris, höna, lamm, får_djur, gammal, leta, hitta]
stretch: [bonde, äng, gräs, brun]

illustration: >-
  A classic Swedish farmstead in summer: red barn and farmhouse, an old
  farmer (Sven, 73, cap and suspenders) counting animals; four cows and a
  brown horse grazing a meadow; three pigs, hens scattered everywhere; a
  cluster of sheep with two lambs visible — and, in the corner of the frame,
  a third lamb asleep in tall grass under an old tree while the golden dog
  bounds toward it. The Berg family on bicycles arriving up the lane.
  Watercolor, warm.

lasstycken:
  - rubrik: "I. MORFARS DJUR"
    block:
      - typ: narration
        text: >-
          Sven Karlsson är Karins pappa — barnens morfar. Han bor inte i
          Sjövik: han bor på en gård, inte långt från staden. Morfar är
          gammal, men han är inte trött! Sven är bonde: en man med en gård
          och många djur.
        margin:
          - "morfar = mammas pappa 👴"
          - "en gård 🚜"
          - "en bonde = en person med en gård"
          - "gammal ↔ ung (en gammal man, ett gammalt hus)"

      - typ: narration
        text: >-
          Familjen cyklar till gården. Vad finns på gården? Djur — många
          djur! Morfar har fyra kor. Korna är stora, och de äter gräs på
          ängen. Han har en häst: hästen heter Brunte, och den är brun.
          Morfar har också tre grisar och tio hönor. Grisarna äter allt!
          Och hönorna? De går här och där och letar mat.
        margin:
          - "en ko — fyra kor 🐄"
          - "en häst 🐎 (Brunte är brun 🟤)"
          - "en gris — grisar 🐖"
          - "en höna — hönor 🐔"
          - "en äng: grönt gräs 🌿"

      - typ: narration
        text: >-
          Och morfar har får — åtta får! Ett får, två får, åtta får:
          ordet är samma. Fåren äter gräs på ängen med korna.
          Ett får får mat av morfar: fåret får gräs. Får får gräs! Och små
          får? De heter lamm: ett lamm, två lamm. På gården finns tre
          lamm, och de är vita och små.
        margin:
          - "ett får — två får 🐑 (samma ord!)"
          - "djuret 'får' och verbet 'får': FÅR FÅR GRÄS! 😄"
          - "ett lamm = ett litet får"

      - typ: narration
        text: >-
          Varje morgon får alla djuren mat: korna och fåren får gräs,
          grisarna får mycket mat, och hönorna letar själva. Alla djuren
          äter — och morfar ser på dem. – Alla är här, säger han. Men är
          alla här?
        margin:
          - "varje morgon = morgon, morgon, morgon …"
          - "alla = 100%!"

  - rubrik: "II. ETT LAMM ÄR BORTA!"
    block:
      - typ: narration
        text: >-
          Astrid ser på lammen. Ett lamm, två lamm … var är tre? – Morfar!
          ropar hon. Ett lamm är borta! Morfar kommer och ser: ja, ett
          lamm är borta. Ingen ser det. Är det på ängen? Nej, på ängen
          finns inget lamm — bara korna och fåren. Är det bakom huset?
          Nej, där är ingen. Var är lammet?
        margin:
          - "borta = inte här! 😨"
          - "ingen/inget/inga = 0"
          - "något lamm? — inget lamm!"

      - typ: narration
        text: >-
          Alla letar. Oskar letar bakom huset. Nils letar på ängen. Karin
          och Anders letar vid vattnet — finns det något lamm där? Nej,
          inget. Astrid frågar hönorna: – Har ni något lamm? Men hönorna
          svarar inte. Och Ludde? Ludde springer här och där … och nu hör
          alla hunden: – Voff! Voff!
        margin:
          - "letar 🔍 = var är det?"
          - "– Voff! (så 'talar' en hund)"

      - typ: narration
        text: >-
          Ludde är vid ett gammalt träd på ängen, och där — där ligger
          lammet! Det sover i gräset. Ludde hittar lammet! – Bra, Ludde!
          säger morfar. Astrid tar lammet — det vaknar och säger: – Bä! Nu
          är alla djuren hemma: korna, hästen, grisarna, hönorna och alla
          fåren. Ingen är borta.
        margin:
          - "hittar = letar … och HÄR är det! ✓"
          - "– Bä! 🐑"
          - "– Bra, Ludde! 👍"

  - rubrik: "III. MJÖLK FRÅN MORFARS KOR"
    block:
      - typ: narration
        text: >-
          Vem är Sven? Han är Karins pappa — barnens morfar, en gammal
          bonde med en gård. Hur många djur har han? Fyra kor, en häst,
          tre grisar, tio hönor och åtta får — och tre lamm! Vem hittar
          lammet? Ludde hittar det under ett gammalt träd: lammet sover i
          gräset. Får alla djuren mat varje morgon? Ja, alla — varje
          morgon.
        margin:
          - "4 + 1 + 3 + 10 + 8 + 3 = många djur!"

      - typ: narration
        text: >-
          På kvällen sätter sig familjen i morfars kök. Alla dricker mjölk
          — mjölken kommer från morfars kor! — och äter bröd med ost.
          Sedan cyklar familjen hem till Sjövik. – Hej då, morfar! Och
          kapitel tio? Kapitel tio: djuren — och vi!
        margin:
          - "mjölk 🥛 ← kor 🐄"
          - "🔍 djuren — och vi …?"

grammatik:
  - rubrik: "någon — ingen"
    forklaring: >-
      Finns det något lamm på ängen? — Nej, det finns inget lamm. Ingen =
      inte någon = 0!
    tabell:
      head: ["", "någon …?", "ingen!"]
      rows:
        - ["en-ord", "någon höna", "ingen höna"]
        - ["ett-ord", "något lamm", "inget lamm"]
        - ["plural", "några djur", "inga djur"]

  - rubrik: "alla och varje"
    forklaring: >-
      Alla djuren äter (100%!). Varje morgon får de mat (morgon, morgon,
      morgon — alla morgnar!).
    tabell:
      head: ["", "exempel"]
      rows:
        - ["alla + plural", "alla djuren, alla fåren"]
        - ["varje + singular", "varje morgon, varje dag"]

  - rubrik: "djurens plural"
    forklaring: >-
      En ko — kor! Ett får — får! Ett lamm — lamm! Många små ord, många
      mönster.
    tabell:
      head: ["singular", "plural", "bestämd plural"]
      rows:
        - ["en ko", "kor", "korna"]
        - ["en häst", "hästar", "hästarna"]
        - ["en gris", "grisar", "grisarna"]
        - ["en höna", "hönor", "hönorna"]
        - ["ett får", "får", "fåren"]
        - ["ett lamm", "lamm", "lammen"]

  - rubrik: "får och får"
    forklaring: >-
      "Får" är ett djur 🐑 — och "får" är ett verb (Misse får mjölk)!
      Samma ord, två saker: Fåret får gräs. Får får gräs. Får lamm mat?
      Ja, lamm får mat av får!
    tabell:
      head: ["", ""]
      rows:
        - ["djuret", "ett får, två får, fåret, fåren"]
        - ["verbet", "jag får, du får, lammet får"]

uttal:
  rubrik: "R smälter ihop med d, n, t"
  forklaring: >-
    I "gård" hör du inte r + d — de är ETT ljud! Samma i barn, korna,
    borta. Lyssna! 👂🔊
  grupper:
    - namn: "rd"
      ord: [gård, gården, bordet]
    - namn: "rn"
      ord: [barn, barnen, korna]
    - namn: "rt"
      ord: [borta, svart]

ovningar:
  A:
    instruktion: "Skriv någon/något/några eller ingen/inget/inga — och plural."
    items:
      - q: "Finns det {något} lamm på ängen? (ett lamm)"
      - q: "Nej, där finns {inget} lamm."
      - q: "Har du {några} pengar? (pengar)"
      - q: "Nej, jag har {inga} pengar."
      - q: "Är {någon} hemma? (en person)"
      - q: "Nej, {ingen} är hemma."
      - q: "en ko — fyra {kor}"
      - q: "en häst — två {hästar}"
      - q: "en gris — tre {grisar}"
      - q: "en höna — tio {hönor}"
      - q: "ett får — åtta {får}"
      - q: "ett lamm — tre {lamm}"
  B:
    instruktion: "Skriv ordet: morfar, gård, bonde, djur, kor, häst, grisar, hönor, får, lamm, äng, gräs, letar, hittar, gammal, borta, alla, varje."
    items:
      - q: "Sven är barnens {morfar}."
      - q: "Han bor på en {gård} med många djur."
      - q: "Sven är {bonde}: han har kor, får och grisar."
      - q: "Korna äter {gräs} på ängen."
      - q: "Hästen Brunte är ett stort brunt {djur}."
      - q: "Ett lamm är {borta}!"
      - q: "Alla {letar} — var är lammet?"
      - q: "Ludde {hittar} lammet under ett träd."
      - q: "Morfar är {gammal}, men inte trött."
      - q: "{Varje} morgon får djuren mat."
      - q: "{Alla} djuren är hemma nu."
      - q: "Ett litet får är ett {lamm}."
  C:
    instruktion: "Svara på frågorna. Skriv hela meningar!"
    items:
      - q: "Vem är Sven Karlsson?"
        model: "Han är Karins pappa — barnens morfar. Han är bonde och bor på en gård."
      - q: "Hur många kor har morfar?"
        model: "Han har fyra kor."
      - q: "Vad heter morfars häst?"
        model: "Den heter Brunte, och den är brun."
      - q: "Vad är borta?"
        model: "Ett lamm är borta — ingen ser det!"
      - q: "Vem hittar lammet, och var?"
        model: "Ludde hittar det under ett gammalt träd — lammet sover i gräset."
      - q: "Vad säger lammet?"
        model: "Det säger: – Bä!"
      - q: "Vad dricker familjen på kvällen?"
        model: "Alla dricker mjölk — den kommer från morfars kor."
repetition:
  rubrik: "Morfar säljer äpplen"
  block:
    - typ: narration
      text: >-
          På morfars gård finns många träd med äpplen — röda och gula
          äpplen. Morfar säljer dem: tio äpplen kostar tjugo kronor, och det
          är billigt! Män och kvinnor från Sjövik kommer till gården och
          köper. De betalar, och morfar får pengarna. – Varsågod! säger
          morfar. Fru Ek köper också morfars äpplen — och säljer dem i
          affären. Där kostar tio äpplen trettio kronor: på gården är
          äpplena billiga, i affären är de inte billiga! Och några äpplen
          får hästen Brunte. Hästar äter äpplen! Brunte äter fem äpplen …
          och letar: finns det några äpplen till? Ja — men de är till
          affären!
