repetition:
  rubrik: "Vänner igen"
  block:
    - typ: narration
      text: >-
          Bråket om klockan på cykeln är slut — och nu lånar Elsa cykeln
          när hon vill: hon frågar först, och Oskar säger ja. – Får jag
          låna cykeln? – Klart! Och den nya klockan på cykeln säger
          "pling": Oskar köpte den själv, med sina pengar. – Jag tycker att
          du är snäll, säger Elsa. – Jag är alltid snäll! – Nu ljuger du, säger
          Elsa och skrattar. Men ofta är du snäll! De skrattar. Ovänner? Aldrig mer. Och om Oskar en
          dag är sur — då väntar Elsa: sura pojkar är snart glada igen, det
          vet hon. Att förlåta är inte lätt, men det är bra — det vet Oskar
          och Elsa nu. Egentligen, säger Karin, är de bästa vänner.
