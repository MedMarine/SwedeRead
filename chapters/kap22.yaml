# KAPITEL 22 — Akta hunden!
# Imperativ (Sitt! Kom! Spring inte! Var lugn!); får/får inte (permission);
# vågar; rädd för. Herr Holm's enormous dog turns out to be an elderly softie.

kapitel: 22
titel: "Akta hunden!"
arc: D
grammatik_fokus: "imperativ (Kom! Gå! Sitt! Var lugn! Spring inte!); får/får inte; vågar; rädd för"
uttal_fokus: "imperativens korta, starka ton: Sitt! Kom! Vänta!"

fokus: [skylt, grind, farlig, våga, rädd, skälla, bita, lugn, klappa, svans, vakta, vifta]
stretch: [staket, morra, slicka]

illustration: >-
  Herr Holm's gate with its hand-painted AKTA HUNDEN! sign; behind the
  fence looms Bill — an absolutely enormous, grizzle-muzzled old dog with
  kind droopy eyes — mid-bark; Astrid already inside patting his huge head
  fearlessly, Nils halfway through the gate, Oskar frozen at the latch with
  one foot ready to flee, Elsa laughing; old herr Holm beaming from his
  porch. Watercolor.

lasstycken:
  - rubrik: "I. SKYLTEN PÅ GRINDEN"
    block:
      - typ: narration
        text: >-
          Vid vägen till skolan, bakom kyrkan, bor herr Holm. Han är en
          gammal man med ett stort hus, ett staket och en grind. På
          grinden sitter en skylt: AKTA HUNDEN! Bakom staketet bor Bill —
          herr Holms hund. Bill är stor. Nej: Bill är STOR — större än
          Ludde, större än alla hundar i Sjövik. När folk går förbi, hör
          de honom skälla: VOFF! VOFF! Och alla går snabbt.
        margin:
          - "en skylt 🪧 = ett litet 'brev' som alla ser"
          - "en grind = en 'dörr' i staketet"
          - "AKTA HUNDEN! = hunden är kanske farlig!"

      - typ: narration
        text: >-
          – Har du sett skylten? frågar Nils. "Akta hunden"! Är Bill
          farlig? – Jag tror det, säger Elsa. Han skäller på alla. Och
          kanske bits han! – Hundar som skäller biter inte, säger Oskar.
          Det vet alla! – Jag är inte rädd, säger Astrid. – Vågar du gå
          in och klappa honom? frågar Elsa. Oskar är tyst en liten tid. –
          Jag … ja! Jag vågar!
        margin:
          - "farlig ⚠ = kan göra dig ont!"
          - "bits = biter! (hundar som bits …)"
          - "vågar = är inte rädd att göra det! 💪"

      - typ: narration
        text: >-
          Barnen står vid grinden. VOFF! VOFF! Bill står bakom grinden
          och skäller — och han morrar: grrr! – Han är arg! säger Nils.
          Gå inte in! – Var lugn, säger Oskar … men han går inte in. Då
          kommer herr Holm från huset. – God dag, barn! Vill ni hälsa på
          Bill? – Är han inte farlig? frågar Nils. Herr Holm skrattar: –
          Farlig? Bill?
        margin:
          - "morrar = grrr! 😾"
          - "Gå inte in! (imperativ + inte!)"
          - "Var lugn! = var inte rädd!"

  - rubrik: "II. DEN STORA HUNDEN"
    block:
      - typ: narration
        text: >-
          – Sitt, Bill! säger herr Holm. Bill sitter. – Kom hit! Bill
          kommer. Och nu ser barnen: Bill är gammal — en mycket gammal
          hund med ett stort huvud och goda ögon. – Klappa honom! säger
          herr Holm. Men var lugna, och spring inte. Astrid är inte
          rädd: hon går först och klappar det stora huvudet. Bill viftar
          med svansen … och slickar hennes hand! – Han är snäll! ropar
          Astrid. – Ja, säger herr Holm. Bill är den snällaste hunden i
          Sjövik. Men det vet inte alla — och det är bra: Bill vaktar
          huset!
        margin:
          - "Sitt! Kom! Klappa! Spring inte!"
          - "viftar med svansen 🐕💓"
          - "slickar 👅 = 'tvättar' din hand"
          - "vaktar = ser på huset — och skäller!"

      - typ: narration
        text: >-
          Nu klappar alla barnen Bill — Nils också. Och Oskar? Oskar
          står vid grinden. – Kom, Oskar! ropar Elsa. Vågar du inte? –
          Klart jag vågar! Oskar går in, långsamt … och klappar Bill
          snabbt, en gång. VOFF! säger Bill glatt. Oskar springer bort —
          tre snabba steg! Alla skrattar, och Bill viftar med svansen. –
          Han är inte farlig, säger Oskar. Jag visste det hela tiden!
        margin:
          - "Vågar du inte? 😏"
          - "'Jag visste det hela tiden!' — Oskar 😄"

      - typ: narration
        text: >-
          Herr Holm berättar om Bill: – Han har bott hos mig i fjorton
          år. Han var liten en gång — liten och snabb! Nu är han gammal,
          och han sover mycket. Men varje natt vaktar han huset och
          trädgården. Ni får komma hit och hälsa på Bill — men fråga
          först, och spring inte vid grinden: Bill är gammal, och han
          behöver lugn. – Vi lovar! säger barnen.
        margin:
          - "får = ✓ det är OK!"
          - "får inte = ✗ förbjudet!"
          - "behöver lugn (lugn = också ett substantiv!)"

      - typ: narration
        text: >-
          Hemma väntar Ludde. Han känner Bill på barnens händer — hundar
          "ser" allt med näsan! Ludde är inte glad: hans barn har
          klappat en annan hund! Astrid tar hans stora huvud: – Var
          lugn, Ludde. Du är vår hund — och du är också snäll! Ludde
          viftar med svansen. Allt är bra igen.
        margin:
          - "hundar 'ser' med näsan 👃"
          - "en annan hund = inte samma hund"

  - rubrik: "III. FARLIG ELLER SNÄLL?"
    block:
      - typ: narration
        text: >-
          Vad sitter på herr Holms grind? En skylt: AKTA HUNDEN! Är Bill
          farlig? Nej — han är den snällaste hunden i Sjövik, men han
          skäller, och han vaktar huset varje natt. Biter han? Nej — han
          slickar! Vem klappar honom först? Astrid: hon är inte rädd.
          Vågar Oskar? Ja … till slut! Vad får barnen göra — och vad får
          de inte? De får komma och hälsa på Bill, men de får inte
          springa vid grinden. Och Ludde? Han är barnens hund — nummer
          ett!
        margin:
          - "rädd för hunden — men Astrid är inte rädd!"

      - typ: narration
        text: >-
          I kapitel tjugotre kommer Lasse hem från havet — och han har
          något med sig i väskan. Vad — och VEM? Det är kapitel
          tjugotre!
        margin:
          - "🔍 Lasse kommer hem …?"

grammatik:
  - rubrik: "imperativ"
    forklaring: >-
      Imperativ = "gör det!" Kom! Gå! Sitt! Vänta! Titta! Verb på -ar:
      imperativ = utan -r (klappa!). Korta verb: som de är (kom! gå! se!).
      Och med inte: Spring inte! Gå inte in!
    tabell:
      head: ["verb", "imperativ"]
      rows:
        - ["kommer", "Kom!"]
        - ["går", "Gå!"]
        - ["sitter", "Sitt!"]
        - ["klappar", "Klappa!"]
        - ["väntar", "Vänta!"]
        - ["är", "Var lugn!"]
        - ["springer", "Spring inte!"]

  - rubrik: "får och får inte"
    forklaring: >-
      Får = det är OK (✓). Får inte = förbjudet (✗)! Ni får hälsa på
      Bill — men ni får inte springa vid grinden.
    tabell:
      head: ["✓ får", "✗ får inte"]
      rows:
        - ["Ni får komma hit.", "Ni får inte springa här."]
        - ["Du får klappa honom.", "Du får inte gå in utan att fråga."]

  - rubrik: "vågar — och rädd för"
    forklaring: >-
      Vågar du? = är du inte rädd? Astrid vågar — hon är inte rädd för
      hundar!
    tabell:
      head: ["", ""]
      rows:
        - ["Vågar du klappa honom?", "Klart jag vågar!"]
        - ["Är du rädd för hundar?", "Nej, jag är inte rädd!"]

  - rubrik: "hundens språk"
    forklaring: >-
      En hund talar inte — men han säger mycket! Skäller (voff!), morrar
      (grrr — arg!), viftar med svansen (glad!), slickar din hand (mycket
      glad!).
    tabell:
      head: ["hunden gör", "hunden 'säger'"]
      rows:
        - ["skäller: VOFF!", "'Någon kommer!'"]
        - ["morrar: grrr", "'Jag är arg — akta dig!'"]
        - ["viftar med svansen", "'Jag är glad!'"]
        - ["slickar din hand", "'Du är min vän!'"]

uttal:
  rubrik: "Imperativens korta ton"
  forklaring: >-
    Imperativ är kort och stark: Sitt! Kom! Vänta! Lyssna på tonen! 👂📢
  grupper:
    - namn: "imperativ"
      ord: ["Sitt!", "Kom!", "Vänta!", "Var lugn!"]
    - namn: "med inte"
      ord: ["Spring inte!", "Gå inte in!"]

