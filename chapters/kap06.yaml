      - q: "Var är Ludde — hemma eller ute?"
        model: "Han är ute på vägen, men Oskar ropar: – Gå hem!"
      - q: "Vart går Misse?"
        model: "Hon går ut genom fönstret och upp i björken — och sedan ner och in i huset."
      - q: "Vad är en gata?"
        model: "En gata är en väg i en stad."
repetition:
  rubrik: "Vart springer Ludde?"
  block:
    - typ: narration
      text: >-
          Ludde springer ut på vägen, och barnen springer med honom.
          Springer han till skolan? Nej! Till affären? Nej! Hunden springer
          till bron — och där, vid vattnet under bron, ligger … Oskars boll!
          – Min boll! ropar Oskar. Han tar bollen, och barnen och hunden går
          hem: över bron, på vägen, genom Sjövik, hem till huset vid sjön. –
          En snäll hund! säger Astrid. Ludde är en mycket snäll hund. Och
          bollen? Den är hemma nu — den också!
