      - q: "– Kom {hit}! ropar Astrid."
      - q: "Misse går {upp} i björken — nu är hon {uppe} i trädet."
      - q: "Katten går {in} genom fönstret — nu är hon {inne}."
  B:
    instruktion: "Skriv ordet: väg, skola, bro, affär, kyrka, buss, tåg, går, åker, cyklar, långt, nära, vatten, station, gata."
    items:
      - q: "Barnen {går} till skolan — de åker inte buss."
      - q: "Oskar {cyklar} på sin röda cykel."
      - q: "Under bron finns {vatten}."
      - q: "Barnen går över {bron}."
      - q: "Sjöviks {kyrka} är stor och vit."
      - q: "Tåget kommer till Sjöviks {station}."
      - q: "{Tåget} åker till Stockholm."
      - q: "En {gata} är en väg i en stad."
      - q: "Skolan ligger inte nära — den ligger {långt} från huset."
      - q: "Affären ligger {nära} bron."
      - q: "{Vägen} går från huset till bron."
      - q: "I Sjövik finns en {skola}, en kyrka och en {affär}."
  C:
    instruktion: "Svara på frågorna. Skriv hela meningar!"
    items:
      - q: "Vart går barnen?"
        model: "De går till skolan — Sjöviks skola."
      - q: "Ligger skolan nära familjens hus?"
        model: "Nej, den ligger långt från huset."
      - q: "Vad finns under bron?"
        model: "Under bron finns vatten — det kommer från Björksjön."
      - q: "Hur kommer barnen till skolan?"
        model: "De går eller cyklar."
      - q: "Vart åker tåget från Sjöviks station?"
