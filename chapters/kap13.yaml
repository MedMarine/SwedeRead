    instruktion: "Skriv klockan på svenska — och verben."
    items:
      - q: "7.30 = {halv} åtta"
      - q: "7.15 = kvart {över} sju"
      - q: "7.45 = kvart {i} åtta"
      - q: "9.30 = halv {tio}"
      - q: "Nils {stiger} upp kvart i sju. (stiga)"
      - q: "Karin {väcker} barnen. (väcka)"
      - q: "Familjen {sitter} i köket och äter frukost. (sitta)"
      - q: "Barnen {borstar} tänderna. (borsta)"
      - q: "Astrid klär {på} sig långsamt."
      - q: "– Skynda {er}! säger Karin. (ni)"
      - q: "Oskar äter mycket {snabbt}. (snabb)"
      - q: "Astrid kammar sig {långsamt}. (långsam)"
  B:
    instruktion: "Skriv ordet: klockan, timme, timmar, minuter, frukost, sitter, stiger, klär, borstar, tänderna, väcker, skyndar, snabb, sen, långsam, bil."
    items:
      - q: "En dag har tjugofyra {timmar}."
      - q: "En timme har sextio {minuter}."
      - q: "Vad är {klockan}? Den är halv åtta!"
      - q: "På morgonen äter familjen {frukost}."
      - q: "Karin {väcker} barnen kvart i sju."
      - q: "Nils {stiger} upp — han är snabb."
      - q: "Oskar sover för länge: han är {sen}."
      - q: "Barnen {borstar} tänderna efter frukosten."
      - q: "Astrid {klär} på sig mycket långsamt."
      - q: "Oskar och Nils {skyndar} sig till skolan."
      - q: "Anders åker {bil} till Växjö."
      - q: "Misse {sitter} under bordet."
  C:
    instruktion: "Svara på frågorna. Skriv hela meningar!"
    items:
      - q: "Vad är 'halv åtta'?"
        model: "Det är sju och trettio minuter — en halv timme till åtta!"
      - q: "Vem vaknar först i huset?"
        model: "Karin vaknar först, klockan halv sju."
      - q: "Vem är snabb på morgonen, och vem är långsam?"
        model: "Nils är snabb — Astrid är långsam!"
      - q: "Varför är Oskar sen?"
        model: "Därför att han sover för länge."
      - q: "Vad äter familjen till frukost?"
        model: "De äter bröd med ost och dricker mjölk."
      - q: "Hur kommer Anders till Växjö?"
        model: "Han åker bil."
      - q: "Varför behöver Ludde inte skynda sig?"
        model: "Därför att en hund inte har någon klocka — han sover!"

repetition:
  rubrik: "Frukost — snabbt och långsamt"
  block:
    - typ: narration
      text: >-
          Oskar äter frukost mycket snabbt — för snabbt! Nu har han ont i
          magen. – Långsamt, Oskar! säger mamma. Magen vill äta långsamt.
          Astrid talar och talar — och äter inte. – Ät nu, Astrid! Klockan
          är tjugo över sju! Och Ludde? Ludde äter på en minut, och hans
          mage har det bra. Efter frukosten tvättar sig barnen och borstar
          tänderna. Karin ser på Astrids öron: – Och öronen, Astrid? Tvättar du öronen? –
          Öronen?! Astrid tvättar öronen — långsamt. Klockan är kvart i
          åtta: – Skynda er! En morgon i huset vid sjön. Varje morgon!
