# KAPITEL 13 — En ny dag
# The Swedish clock (halv åtta!), morning-routine verbs with particles and
# reflexives, adjective → adverb (-t). One school morning, minute by minute.

kapitel: 13
titel: "En ny dag"
arc: C
grammatik_fokus: "klockan (halv, kvart i/över); stiger upp, klär på sig, skyndar sig; snabb → snabbt (adverb!)"
uttal_fokus: "sj-ljud i skynda (sk + y!); sju, sjuttio"

fokus: [klocka, timme, frukost, sitta, stiga, klä, borsta, tand, väcka, skynda, snabb, sen]
stretch: [minut, kamma, långsam, bil]

illustration: >-
  A morning told as a clock face: around a big analog clock, small vignettes
  at their times — 6:30 Karin waking; 6:45 opening the boys' door (Nils
  sitting up, Oskar a lump under blankets); 7:00 breakfast table; 7:10 Oskar
  arriving disheveled; 7:30 toothbrushing chaos at one sink; 7:45 three kids
  out the door, one shoe untied; the golden dog asleep in a bed he shouldn't
  be in. Watercolor.

lasstycken:
  - rubrik: "I. VAD ÄR KLOCKAN?"
    block:
      - typ: narration
        text: >-
          En dag har tjugofyra timmar, och en timme har sextio minuter.
          Vad är klockan? Klockan är sju. Klockan är åtta. Men vad är
          "halv åtta"? Halv åtta är inte åtta — det är sju och trettio
          minuter: en halv timme till åtta! Och "kvart över sju"? Det är
          sju och femton minuter. "Kvart i åtta" är sju och fyrtiofem.
        margin:
          - "en klocka 🕐"
          - "OBS! halv åtta = 7.30 (inte 8.30!)"
          - "kvart över sju = 7.15"
          - "kvart i åtta = 7.45"
          - "1 timme = 60 minuter"

  - rubrik: "II. MORGONEN HEMMA"
    block:
      - typ: narration
        text: >-
          Klockan är halv sju, och det är morgon i huset vid sjön. Karin
          vaknar först. Kvart i sju väcker hon barnen: – God morgon! Upp,
          upp! Nils stiger upp — han är snabb på morgonen. Men Oskar?
          Oskar sover. – Oskar! Klockan är kvart i sju! Karin väcker
          honom — men Oskar hör inte: han sover och sover. Nu stiger
          Astrid också upp.
        margin:
          - "väcker = säger 'vakna!' 📢"
          - "stiger upp = går upp från sängen"
          - "snabb ↔ långsam"

      - typ: narration
        text: >-
          Klockan sju sitter familjen i köket och äter frukost: bröd med
          ost, och mjölk. Frukost är morgonens mat. Misse sitter under
          bordet och ser på mjölken. Astrid äter långsamt — hon talar och talar. Nu kommer
          Oskar ner. Han är sen: klockan är tio över sju! – Du är sen,
          säger Nils. Oskar äter sin frukost mycket snabbt.
        margin:
          - "sitter = ÄR på stolen 🪑"
          - "frukost 🍞 = mat på morgonen"
          - "sen 😰"
          - "äter snabbt (snabb + t = adverb!)"

      - typ: narration
        text: >-
          Efter frukosten borstar barnen tänderna — Oskar borstar sina
          tänder mycket snabbt! Astrid kammar sitt långa hår, långsamt,
          långsamt. Sedan
          klär de på sig. Astrid klär på sig mycket långsamt: – Var är
          mina saker? Mamma! Klockan är halv åtta: nu måste barnen gå. –
          Skynda er! säger Karin. Oskar och Nils skyndar sig … men Astrid
          är Astrid.
        margin:
          - "borstar tänderna 🪥"
          - "kammar håret 💇"
          - "klär på sig 👕"
          - "Skynda er! = snabbt, snabbt! 🏃"

      - typ: narration
        text: >-
          Kvart i åtta går barnen till skolan — de måste vara där klockan
          åtta. Anders åker bil till Växjö: han har bilen vid huset. Karin
          cyklar: Sjöviks sjuka människor behöver sin läkare! Och Ludde?
          Ludde har ingen klocka. Han lägger sig i Oskars säng och sover.
          En hund behöver inte skynda sig!
        margin:
          - "en bil 🚗"
          - "Ludde har ingen klocka 😴"

  - rubrik: "III. KLOCKAN OCH MORGONEN"
    block:
      - typ: narration
        text: >-
          Vad är klockan när Karin vaknar? Halv sju. När väcker hon
          barnen? Kvart i sju. När sitter familjen i köket och äter
          frukost — och hur länge? Klockan sju, en halv timme. När stiger
          Oskar upp? Sent! Vem borstar tänderna snabbt? Oskar. Vem klär
          på sig långsamt? Astrid! När går barnen? Kvart i åtta — och
          klockan åtta är de i skolan. Och vem är sen? Oskar. Han sover
          för länge!
        margin:
          - "för länge = mycket, MYCKET länge!"

      - typ: narration
        text: >-
          Nu är barnen i skolan, pappa är i Växjö, och mamma är med sjuka
          människor. Ludde sitter inte — han ligger, i Oskars säng! Men
          vad gör barnen i skolan, och vem är fru Lind? Det är kapitel
          fjorton!
        margin:
          - "🔍 skolan … fru Lind …?"

grammatik:
  - rubrik: "klockan"
    forklaring: >-
      Vad är klockan? Klockan är sju. Halv åtta = 7.30 — en halv timme
      TILL åtta! Kvart över sju = 7.15. Kvart i åtta = 7.45.
    tabell:
      head: ["klockan", "svenska"]
      rows:
        - ["7.00", "klockan (är) sju"]
        - ["7.15", "kvart över sju"]
        - ["7.30", "halv åtta (OBS!)"]
        - ["7.45", "kvart i åtta"]
        - ["8.00", "klockan åtta"]

  - rubrik: "morgonens verb"
    forklaring: >-
      Många morgonverb har en liten partikel eller "sig": stiger UPP,
      klär PÅ SIG, skyndar SIG.
    tabell:
      head: ["", "exempel"]
      rows:
        - ["stiger upp", "Nils stiger upp kvart i sju."]
        - ["klär på sig", "Astrid klär på sig långsamt."]
        - ["skyndar sig", "Oskar och Nils skyndar sig."]
        - ["borstar tänderna", "efter frukosten"]
        - ["kammar håret", "Astrid — långsamt!"]

  - rubrik: "sitta, sätta sig — ligga, lägga sig"
    forklaring: >-
      Sätter sig → och nu SITTER man! Lägger sig → och nu LIGGER man!
    tabell:
      head: ["riktning →", "läge 📍"]
      rows:
        - ["Misse sätter sig under bordet", "nu sitter hon där"]
        - ["Ludde lägger sig i sängen", "nu ligger han där"]

  - rubrik: "snabb → snabbt (adverb)"
    forklaring: >-
      Nils är snabb (adjektiv) — han äter snabbt (adverb, med -t!).
      Astrid är långsam — hon klär på sig långsamt.
    tabell:
      head: ["adjektiv", "adverb"]
      rows:
        - ["Oskar är snabb.", "Oskar äter snabbt."]
        - ["Astrid är långsam.", "Astrid kammar sig långsamt."]

uttal:
  rubrik: "Sj-ljud i skynda!"
  forklaring: >-
    Sk före e, i, y, ä, ö = sj-ljud: skynda! Och sju, sjuttio har sj.
    Men skola har hårt sk. Lyssna! 👂🔊
  grupper:
    - namn: "sj-ljud"
      ord: [skynda, sju, sjuttio, Sjövik]
    - namn: "hårt sk"
      ord: [skola, skrattar, skog]

