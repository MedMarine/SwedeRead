# KAPITEL 7 — Astrid och Misse
# Transfer verbs (ger/får) with two objects; reflexive verbs (tvättar sig,
# lägger sig, sätter sig). A day in the parallel lives of girl and cat.

kapitel: 7
titel: "Astrid och Misse"
arc: B
grammatik_fokus: "ger/får (två objekt!); reflexiva verb (tvättar sig, lägger sig, sätter sig); vad gör X?"
uttal_fokus: "lång eller kort vokal: mat — katt, äter — sätter"

fokus: [ge, få, göra, mjölk, mat, äta, dricka, sova, vakna, tvätta, lägga, sätta]
stretch: [visa, morgon, kväll, trött]

illustration: >-
  A day in split panels, girl and cat mirrored: morning — Astrid waking with
  the grey cat on her pillow; washing (girl with water, cat with tongue);
  kitchen — milk poured into a saucer under the table while the golden dog
  inhales his bowl; midday — empty house, cat asleep in a sunbeam on the
  child's bed; evening — Astrid showing the cat a picture book while the cat
  stares at the milk glass; night — girl asleep, cat silhouette slipping out
  the window. Warm watercolor.

lasstycken:
  - rubrik: "I. MORGON"
    block:
      - typ: narration
        text: >-
          Det är morgon i huset vid sjön. Astrid vaknar i sin säng — och vad
          ser hon? Misse! Katten ligger i sängen, och nu vaknar hon också.
          – God morgon, Misse! säger Astrid. – Mjau! säger katten.
        margin:
          - "morgon 🌅"
          - "vaknar: 😴 → 👀"
          - "God morgon! (= hej på morgonen)"

      - typ: narration
        text: >-
          Astrid tvättar sig med vatten. Och Misse? Misse tvättar sig också
          — men inte med vatten! Katter tvättar sig själva, och de tvättar
          sig och tvättar sig. Sedan går Astrid ner till köket, och katten
          går med henne.
        margin:
          - "tvättar SIG (sig = X själv!)"
          - "katten tvättar sig själv 🐈🧼"

      - typ: narration
        text: >-
          Karin är i köket. Hon ger barnen mat. Astrid sätter sig vid bordet
          och äter. Hon dricker mjölk — mjölken är vit och god! Misse får
          också mjölk: Astrid ger katten mjölk. Misse dricker sin mjölk
          under bordet. Och Ludde? Ludde får mat och vatten. Hunden äter och
          äter — Ludde äter mycket, men Misse äter litet.
        margin:
          - "ger Misse mjölk = ger mjölk TILL Misse"
          - "får ← : Misse får mjölk av Astrid"
          - "mjölk 🥛 · mat 🍽"
          - "äter 😋 · dricker 🥛"

      - typ: narration
        text: >-
          Vem ger Misse mjölk? Astrid ger henne mjölk — katten får mjölk av
          Astrid. Vem får mat av Karin? Barnen och Ludde får mat av henne.
          Får Ludde Misses mjölk? Nej! Ludde får vatten, och Misse får
          mjölk. Och vad gör Ludde med maten? Han äter den!
        margin:
          - "ger ↔ får"
          - "Vad gör X? — X äter/sover/leker …"

  - rubrik: "II. KATTEN ÄR HEMMA"
    block:
      - typ: narration
        text: >-
          Sedan går Astrid till skolan med sina bröder. Men Misse går inte
          till skolan — katter går inte i skolan! Vad gör katten? Hon sover!
          Misse lägger sig i Astrids säng och sover. Katter sover mycket:
          de sover och sover.
        margin:
          - "lägger SIG = går och ligger! 🛏"
          - "sover 😴 'zzz'"

      - typ: narration
        text: >-
          Misse vaknar och äter litet mat. Sedan går hon ut genom fönstret
          och upp i björken. Där ser katten långt: vägen, bron, skolan …
          Var är Astrid? Hon är i skolan. Misse går ner och in, lägger sig
          i sängen — och sover.
        margin:
          - "ut → upp → ner → in (kapitel sex!)"

  - rubrik: "III. KVÄLL"
    block:
      - typ: narration
        text: >-
          Astrid kommer hem från skolan. – Misse! Misse! ropar hon. Katten
          vaknar och kommer ner till henne. Astrid sätter sig på en stol i
          köket, och Misse sätter sig vid henne. Astrid visar Misse sin nya
          bok: – Ser du, Misse? Min bok! Men Misse ser inte på boken —
          katten ser på mjölken på bordet! Astrid skrattar och ger henne
          mjölk, och Misse dricker.
        margin:
          - "sätter SIG 🪑 (lägger sig 🛏)"
          - "visar = 'Se!' 👀"

      - typ: narration
        text: >-
          Det är kväll. Familjen äter i köket; Anders och Karin sätter sig
          vid bordet med barnen, och maten är god. Sedan är barnen trötta.
          Astrid är mycket trött: hon tvättar sig och lägger sig i sin
          säng. Och vem kommer nu? Misse! Katten lägger sig vid Astrid. –
          Sov gott, Misse, säger Astrid.
        margin:
          - "kväll 🌆 (morgon ↔ kväll)"
          - "trött 😴 = 'jag vill sova!'"
          - "Sov gott! 🌙"

      - typ: narration
        text: >-
          Astrid sover — men Misse sover inte! Nu är katten inte trött. Hon
          ser ut genom fönstret … och går ut! Vart går Misse på kvällen?
          Ja, vart? Det är kattens sak! Men i kapitel åtta går Oskar och
          Nils till affären. Vad finns i affären — och vad gör pojkarna
          där? Det är kapitel åtta!
        margin:
          - "🔍 kattens sak … och affären!"

grammatik:
  - rubrik: "ger och får — två objekt!"
    forklaring: >-
      Astrid ger Misse mjölk: två objekt — till vem? (Misse) och vad?
      (mjölk). Och Misse får mjölk av Astrid. Ger ↔ får!
    tabell:
      head: ["", ""]
      rows:
        - ["Astrid ger Misse mjölk.", "= Astrid ger mjölk till Misse."]
        - ["Misse får mjölk.", "= Misse får mjölk av Astrid."]
        - ["Karin ger barnen mat.", "Barnen får mat av Karin."]

  - rubrik: "verb med sig"
    forklaring: >-
      Misse tvättar sig = katten tvättar katten! Jag tvättar mig, du
      tvättar dig — men han, hon och de tvättar SIG.
    tabell:
      head: ["", ""]
      rows:
        - ["jag tvättar mig", "vi tvättar oss"]
        - ["du tvättar dig", "ni tvättar er"]
        - ["han/hon tvättar sig", "de tvättar sig"]

  - rubrik: "ligger — lägger sig; sätter sig"
    forklaring: >-
      Misse LIGGER i sängen: hon är där. Misse LÄGGER SIG i sängen: hon
      går dit — och nu ligger hon! Astrid SÄTTER SIG på stolen.
    tabell:
      head: ["läge 📍", "riktning →"]
      rows:
        - ["Misse ligger i sängen.", "Misse lägger sig i sängen."]
        - ["Astrid är på stolen.", "Astrid sätter sig på stolen."]

  - rubrik: "morgon och kväll"
    forklaring: >-
      På morgonen vaknar Astrid. På kvällen är hon trött och lägger sig.
      Morgon 🌅 ↔ kväll 🌆.
    tabell:
      head: ["", ""]
      rows:
        - ["på morgonen", "Astrid vaknar och tvättar sig"]
        - ["på kvällen", "hon är trött och lägger sig"]

uttal:
  rubrik: "Lång eller kort vokal?"
  forklaring: >-
    Lyssna på a i mat (lååång!) och i katt (kort!). En vokal + två
    konsonanter = kort vokal. Lyssna! 👂🔊
  grupper:
    - namn: "lång vokal"
      ord: [mat, äter, sova, ger]
    - namn: "kort vokal"
      ord: [katt, sätter, mjölk, vaknar]

ovningar:
  A:
    instruktion: "Skriv rätt form: sig/mig/dig/oss — och verbet."
    items:
      - q: "Astrid tvättar {sig} med vatten."
      - q: "Jag tvättar {mig}."
      - q: "Du tvättar {dig}."
      - q: "Barnen lägger {sig} på kvällen."
      - q: "Vi sätter {oss} vid bordet."
      - q: "Astrid {ger} Misse mjölk. (ge)"
      - q: "Misse {får} mjölk av Astrid. (få)"
      - q: "Ludde {får} mat och vatten. (få)"
      - q: "Astrid {visar} Misse sin nya bok. (visa)"
      - q: "Misse {lägger} sig i Astrids säng. (lägga)"
      - q: "Astrid {sätter} sig på en stol. (sätta)"
      - q: "Astrid {vaknar} i sin säng. (vakna)"
  B:
    instruktion: "Skriv ordet: ger, får, visar, gör, mjölk, mat, äter, dricker, sover, vaknar, tvättar, lägger, sätter, morgon, kväll, trött."
    items:
      - q: "Det är {morgon}: Astrid vaknar."
      - q: "Misse {dricker} sin mjölk under bordet."
      - q: "Ludde {äter} mycket mat."
      - q: "Katter {tvättar} sig själva."
      - q: "Misse {sover} mycket — hon sover och sover!"
      - q: "Astrid dricker vit och god {mjölk}."
      - q: "Karin ger barnen och Ludde {mat}."
      - q: "Vad {gör} katten? Hon sover!"
      - q: "På kvällen är Astrid {trött}."
      - q: "Det är {kväll}: barnen lägger sig."
      - q: "Astrid {visar} Misse sin bok."
      - q: "Misse {får} mjölk av Astrid."
  C:
    instruktion: "Svara på frågorna. Skriv hela meningar!"
    items:
      - q: "Vem ligger i Astrids säng på morgonen?"
        model: "Misse ligger där — och hon vaknar med Astrid."
      - q: "Tvättar sig Misse med vatten?"
        model: "Nej! Katter tvättar sig själva — inte med vatten."
      - q: "Vad får Ludde av Karin?"
        model: "Han får mat och vatten."
      - q: "Vad gör Misse hemma?"
        model: "Hon sover, äter litet mat — och går upp i björken."
      - q: "Vad visar Astrid för Misse?"
        model: "Hon visar Misse sin nya bok — men katten ser på mjölken!"
      - q: "Är Misse trött på kvällen?"
        model: "Nej! Astrid sover, men katten går ut genom fönstret."
      - q: "Vem säger 'Sov gott'?"
        model: "Astrid säger det till Misse."
repetition:
  rubrik: "Kvällen i huset"
  block:
    - typ: narration
      text: >-
          Det är kväll i huset vid sjön. Karin ger barnen mat, och barnen
          äter i köket. Ludde får mat, och Misse får mjölk — under bordet.
          Sedan tvättar barnen sig och lägger sig. Astrid visar Misse sin
          docka: – Sov gott, Lisa! Sov gott, Misse! Och huset sover: barnen
          sover, Ludde sover i köket, mamma och pappa sover. Men vem sover
          inte? Misse! Katten går ut genom fönstret. Vart går hon på
          kvällen? Det är kattens sak.
