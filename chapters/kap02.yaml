    items:
      - q: "Karin är en {kvinna}, och Anders är en {man}."
      - q: "Oskar, Nils och Astrid är tre {barn}."
      - q: "Astrid är en {flicka}, och Nils är en {pojke}."
      - q: "Nils är Anders och Karins {son}."
      - q: "Astrid är inte en son — hon är en {dotter}."
