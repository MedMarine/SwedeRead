      - q: "Ludde är en stor {hund}."
      - q: "Misse är Astrids {katt}."
      - q: "Vad {heter} Oskars mamma? Hon heter Karin."
      - q: "Oskar är tolv {år}."
      - q: "Familjen Berg är en svensk {familj}."
  C:
    instruktion: "Svara på frågorna. Skriv hela meningar!"
    items:
      - q: "Vad heter Oskars pappa?"
        model: "Han heter Anders Berg."
      - q: "Är Karin en man?"
        model: "Nej, Karin är inte en man — hon är en kvinna."
      - q: "Hur många barn är i familjen Berg?"
        model: "Tre barn: Oskar, Nils och Astrid."
      - q: "Vems syster är Astrid?"
        model: "Astrid är Oskars och Nils syster."
      - q: "Vad är Misse?"
        model: "Misse är en katt — Astrids katt."
      - q: "Hur många år är Nils?"
        model: "Nils är tio år."
      - q: "Vem är Lasse, och var är han?"
        model: "Lasse är Anders bror. Han är på Atlanten, på ett stort hav."
      - q: "Vems hund är Ludde?"
        model: "Ludde är barnens hund."

repetition:
  rubrik: "Bokstäver och namn"
  block:
    - typ: narration
      text: >-
          O, S, K, A, R — fem bokstäver. Vad är det? Det är en pojke i
          familjen Berg: Oskar! N, I, L, S är fyra bokstäver — och en pojke.
          Vem är A, S, T, R, I, D? En flicka, sju år! "Mamma" och "pappa" är
          ord med fem bokstäver. Och "Sverige"? Sju bokstäver — och ett stort
          land i norr. Danmark ligger i söder: sju bokstäver, ett litet land!
          En familj med två söner och en dotter, en hund med fem bokstäver —
          L, U, D, D, E — och en katt med fem: M, I, S, S, E. Bokstäver,
          siffror och en familj: det är kapitel ett och två!
