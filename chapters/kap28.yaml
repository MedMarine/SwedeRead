    items:
      - q: "Om vädret blir dåligt, {vänder} ni hem. (vända)"
      - q: "Om vinden ökar mer, {måste} vi vända!"
      - q: "Om vi inte kan segla hem, {seglar} vi till ön. (segla)"
      - q: "Lasse tar ner seglet. → Seglet {tas} ner."
      - q: "Man ställer upp masten. → Masten {ställs} upp."
      - q: "Vinden {ökar}: den blir starkare och starkare. (öka)"
      - q: "Vågorna {blir} höga. (bli)"
      - q: "Båten {vände} mot ön. (vända, preteritum)"
      - q: "Alla har {seglat} hem — säkra! (segla, supinum)"
      - q: "en våg — många {vågor}"
      - q: "ett segel — {seglet}"
      - q: "Lasse {lugnar} Astrid: – Var inte rädd! (lugna)"
  B:
    instruktion: "Skriv ordet: segel, seglar, mast, vågor, ökar, vänder, strand, säkra, äventyr, flytväst, lugnar."
    items:
      - q: "Morfars båt har en mast och ett vitt {segel}."
      - q: "Alla tar på sig {flytväst} — det gör man alltid i en båt!"
      - q: "Båten {seglar} ut på Björksjön."
      - q: "Vinden {ökar} — den blir starkare och starkare."
      - q: "{Vågorna} blir höga: upp och ner, upp och ner!"
      - q: "– Vi {vänder}! ropar Lasse."
      - q: "Vid {stranden} stiger alla ur båten."
      - q: "Våta och kalla — men {säkra}!"
      - q: "Lasse {lugnar} Astrid under trädet."
      - q: "– Det var ett {äventyr}! säger Oskar."
      - q: "Båten går upp och ner, och {masten} går mot himlen."
  C:
    instruktion: "Svara på frågorna. Skriv hela meningar!"
    items:
      - q: "Vad sa Karin innan de seglade ut?"
        model: "Om vädret blir dåligt, vänder ni hem!"
      - q: "Varför tar alla på sig flytvästar?"
        model: "Därför att det gör man alltid i en båt — då är man säker."
      - q: "Vad hände efter en timme på sjön?"
        model: "Moln kom över skogen, vinden ökade, och vågorna blev höga."
      - q: "Varför kunde de inte segla hem?"
        model: "Därför att vinden stod mot dem."
      - q: "Vad gjorde de på ön?"
        model: "De väntade under ett stort träd medan ovädret gick förbi."
      - q: "Vad gjorde Lasse när Astrid var rädd?"
        model: "Han lugnade henne och berättade om oväder på Atlanten."
      - q: "Vad säger Oskar om vågorna — och vad säger Nils?"
        model: "Oskar säger att de var höga som hus. Nils säger: höga som Ludde!"

repetition:
  rubrik: "Efter midsommar"
  block:
    - typ: narration
      text: >-
          Efter midsommar står majstången på ängen i många veckor — grön
          först, sedan brun. – Vi ställde upp den, alla — och den står till
          augusti! säger morfar. I dag hjälper barnen honom med något
          annat: de ska äta ute. Barnen dukar det långa bordet, och gäster
          kommer: Elsa och fru Ek. Efter maten badar alla i sjön. Oskar
          simmar långt ut. – Inte för långt! ropar Karin. Nils och Elsa
          simmar vid stranden, och Astrid badar där vattnet är lågt. Ludde
          simmar efter en boll: hundar kan alltid simma! Sedan äter alla
          jordgubbar i gräset. – Vi firar sommaren, säger morfar. Varje
          varm dag är en liten midsommar!
