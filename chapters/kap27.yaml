      - q: "Varför blir kvällen aldrig mörk?"
        model: "Därför att det är årets ljusaste natt — solen går nästan inte ner."

repetition:
  rubrik: "Vingar till Lisa"
  block:
    - typ: narration
      text: >-
          Efter morfars saga vill Oskar bygga vingar. – Som pojken i
          sagan! – Nej, säger mamma. Pojkar flyger inte! Men små vingar
          till en docka … det går. Oskar och Nils bygger två små vingar av
          papper och fjädrar — fjädrar från morfars hönor, inte från örnar!
          Lisa får vingarna. – Nu provar vi, säger Oskar. Från bordet! –
          Jag varnar dig, säger Nils. Dockor kan inte flyga. – Lisa är
          modig, säger Astrid. Och dockan "flyger" — från bordet, genom
          luften … ner. – Hon flög! ropar Astrid. Litet! Alla skrattar. Att
          bygga vingar är lätt; att flyga är inte lätt. Det visste pojken i
          sagan också.
