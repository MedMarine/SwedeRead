# KAPITEL 27 — Midsommar
# The most Swedish day meets the most Swedish grammar: particle verbs with
# stressed particles (ställer upp, tar fram, håller på), the hälsar-på
# homograph — and Maria meets the family.

kapitel: 27
titel: "Midsommar"
arc: E
grammatik_fokus: "partikelverb med betonad partikel (ställer UPP, tar FRAM, håller PÅ med); hälsar på — och hälsar på!"
uttal_fokus: "betonad partikel: ställer UPP, tar FRAM — rytmen som betyder något!"

fokus: [midsommar, majstång, blomma, krans, sill, potatis, jordgubbe, dansa, sjunga, fira, ställa, hålla]
stretch: [duka, gäst, grädde, lek, hjälpa]

illustration: >-
  Midsummer meadow at morfar's farm in full sun: the leafy flower-dressed
  maypole being raised by a chain of family and neighbours (one-two-THREE!);
  a long white-clothed table with herring, new potatoes and a mountain of
  strawberries and cream; girls in flower crowns; the golden dog wearing —
  and eating — his own crown; and at the gate, Lasse arriving hand in hand
  with a laughing brown-haired woman while three children point in delighted
  recognition. Watercolor, high summer light.

lasstycken:
  - rubrik: "I. ÅRETS LÄNGSTA DAG"
    block:
      - typ: narration
        text: >-
          Det är midsommar — årets längsta dag och ljusaste natt!
          Midsommar firas i hela Sverige: man är ute, man äter gott, och
          man dansar. I dag firar familjen Berg midsommar på morfars gård, och redan
          på morgonen åker de dit — Ludde springer först in genom grinden,
          för han har bott här en vecka, och nu är HAN hemma!
        margin:
          - "midsommar ☀🌸 = årets längsta dag"
          - "firas i HELA Sverige!"
          - "fira 🎉 = ha en stor, glad dag"

      - typ: narration
        text: >-
          Mitt på ängen ligger majstången. Den är lång — längre än tre
          män! Gäster kommer till gården: fru Ek och Elsa, herr Holm —
          och Bill! Först tar alla fram blommor och små gröna björkar.
          Alla hjälper, och majstången blir grön, vit och gul av björkar
          och blommor.
        margin:
          - "en majstång 🎏 — midsommarens 'träd'"
          - "tar FRAM = tar — och nu ser alla det!"
          - "hjälper 🤝 = gör det tillsammans"
          - "en gäst = kommer till festen!"

      - typ: narration
        text: >-
          – Nu ställer vi upp majstången! ropar morfar. Alla står runt
          den: män, kvinnor och barn. – Håll fast! ropar morfar. Alla
          håller. – Ett, två, TRE! Och upp går den —
          högre och högre — och nu står den! Majstången står mitt på
          ängen, grön mot den blåa himlen. Alla ropar: – Hurra!
        margin:
          - "ställer UPP = från liggande till stående!"
          - "runt ⭕"
          - "– Hurra! 🎉"

      - typ: narration
        text: >-
          Astrid och Elsa sitter i gräset och gör kransar: små blommor
          blir en rund "ring" — en krans! — som man har på huvudet.
          Astrid gör en krans till Lisa också … och en krans till Ludde.
          Och Ludde? Han äter den!
        margin:
          - "en krans 🌸⭕ på huvudet"
          - "Ludde äter kransen 🐕😄"

  - rubrik: "II. SILL, JORDGUBBAR — OCH MARIA!"
    block:
      - typ: narration
        text: >-
          Sedan dukar alla det långa bordet ute på ängen — maten ställs
          fram: sill och potatis, bröd och ost — och till slut
          jordgubbar med grädde!
          Sill är fisk, liten fisk från havet, och den äter man på
          midsommar: sill och den första potatisen. Jordgubbar är röda
          och mycket goda, och grädde är vit och kommer från mjölken. –
          Mer jordgubbar, tack! säger alla barn.
        margin:
          - "dukar = ställer maten på bordet 🍽"
          - "sill 🐟 + potatis 🥔 = midsommarens mat"
          - "jordgubbar 🍓 med grädde!"

      - typ: narration
        text: >-
          Då hör alla en bil på vägen. Vem kommer? Lasse! Och han är
          inte ensam: ur bilen kommer en ung kvinna med långt brunt hår
          och glada ögon. – Det är Maria! ropar Astrid. Flickan från
          fotografiet! Maria hälsar på alla: – Hej! Jag har hört så
          mycket om er. Och nu förstår du två ord som är samma — nästan:
          när Lasse hälsar PÅ familjen, kommer han hit. När Maria hälsar
          på Anders, säger hon hej. Samma ord — två saker! Betoningen
          gör ordet.
        margin:
          - "Maria!! ❤"
          - "hälsar PÅ (kommer hit!) ↔ hälsar på (säger hej!)"
          - "betoningen gör ordet!"

      - typ: narration
        text: >-
          Efter maten dansar alla runt majstången — gamla danser som
          alla kan. Man sjunger och dansar, runt och runt — och sjunger
          igen: stora och små, morfar och Astrid, Lasse och Maria. Sedan håller barnen på med lekar på ängen, där de springer och
          leker till kvällen — men kvällen blir aldrig mörk, för solen går
          nästan inte ner: det är årets ljusaste natt. Klockan tolv är himlen ljus — och
          barnen sover inte än!
        margin:
          - "dansar runt majstången ⭕🎶"
          - "sjunger 🎶"
          - "håller PÅ med = gör och gör och gör!"
          - "årets ljusaste natt ☀🌙"

  - rubrik: "III. MIDSOMMARENS ORD"
    block:
      - typ: narration
        text: >-
          Vad firar familjen? Midsommar — årets längsta dag. Vad ställer
          alla upp? Majstången! Vad gör flickorna av blommorna? Kransar.
          Vad äter man på midsommar? Sill och potatis — och jordgubbar
          med grädde! Vad håller barnen på med hela kvällen? Lekar! Vem
          kommer med Lasse? Maria, flickan från fotografiet! Alla
          sjunger, alla dansar, och ingen vill sova.
        margin:
          - "frågar → svarar"

      - typ: narration
        text: >-
          Och ringen? Sch — den ligger i Lasses väska … än! I kapitel
          tjugoåtta åker Lasse och barnen ut på sjön, och där väntar
          något stort. Det är kapitel tjugoåtta!
        margin:
          - "🔍 ut på sjön …?"

grammatik:
  - rubrik: "partikelverb"
    forklaring: >-
      Ett litet ord efter verbet — och verbet blir nytt! Tar FRAM,
      ställer UPP, håller PÅ. Partikeln är alltid betonad: man hör den
      starkt!
    tabell:
      head: ["partikelverb", "= vad?"]
      rows:
        - ["tar FRAM", "tar — och nu ser alla det"]
        - ["ställer UPP", "sätter den att stå"]
        - ["håller PÅ (med)", "gör och gör och gör"]
        - ["stiger PÅ / stiger AV", "in i tåget / ut ur tåget (kapitel 19!)"]
        - ["klär PÅ sig", "kläder på kroppen (kapitel 13!)"]

  - rubrik: "hälsar på — och hälsar på!"
    forklaring: >-
      Samma ord, två saker — betoningen gör ordet! Hälsar PÅ (partikeln
      betonad) = kommer till dig. Hälsar på (utan betonad partikel) =
      säger hej.
    tabell:
      head: ["", ""]
      rows:
        - ["Lasse hälsar PÅ familjen.", "= han kommer till dem! 🏠"]
        - ["Maria hälsar på Anders.", "= hon säger hej! 👋"]

  - rubrik: "midsommarens dag"
    forklaring: >-
      Så firar man midsommar: majstången ställs upp, kransar görs,
      sill och jordgubbar äts — och alla dansar till den ljusa natten!
    tabell:
      head: ["", ""]
      rows:
        - ["🎏 majstången", "ställs upp mitt på ängen"]
        - ["🌸 kransar", "blommor — på huvudet!"]
        - ["🐟🥔🍓 maten", "sill, potatis, jordgubbar med grädde"]
        - ["💃🎶 dansen", "runt och runt, till den ljusa natten"]

  - rubrik: "hjälpa"
    forklaring: >-
      Hjälpa = göra det tillsammans med någon. Alla hjälper med
      majstången! Och "Hjälp!" = kom och hjälp mig — nu!
    tabell:
      head: ["", ""]
      rows:
        - ["Alla hjälper morfar.", "Kan du hjälpa mig?"]
        - ["Hjälp!", "= kom — nu!"]

uttal:
  rubrik: "Betonad partikel"
  forklaring: >-
    Lyssna på rytmen: ställer UPP, tar FRAM, håller PÅ — det lilla ordet
    är starkt! Och: hälsar PÅ (kommer) mot hälsar på (säger hej). 👂🎵
  grupper:
    - namn: "partikeln är stark!"
      ord: [ställer upp, tar fram, håller på, stiger av]
    - namn: "två 'hälsar på'"
      ord: [hälsar på familjen, hälsar på och säger hej]

