        model: "Årets längsta dag och ljusaste natt — Sveriges stora sommardag!"
      - q: "Vad gör alla med majstången?"
        model: "De tar fram blommor och björkar — och sedan ställer alla upp den!"
      - q: "Vad händer med Luddes krans?"
