<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" font-family="'Source Sans 3','Segoe UI',sans-serif">
  <style>
    .n{fill:#3a4550;font-weight:700;font-size:14.5px;text-anchor:middle}
    .d{fill:#5a6b7a;font-size:12.5px;font-style:italic;text-anchor:middle}
  </style>
  <rect width="800" height="560" fill="#e8f0e2"/>
  <rect x="6" y="6" width="788" height="548" fill="none" stroke="#8a3033" stroke-width="3"/>
  <text x="400" y="44" text-anchor="middle" font-size="24" font-weight="700" fill="#8a3033">VÄGEN TILL SKOLAN</text>

  <!-- lake + stream -->
  <path d="M6,300 C60,270 120,270 160,300 C190,324 190,380 150,410 C100,446 30,440 6,410 Z" fill="#4a7fae"/>
  <text class="n" x="90" y="356" fill="#fdf8ee">Björksjön</text>
  <path d="M160,330 C240,320 280,300 320,260 C350,230 380,220 420,224" stroke="#4a7fae" stroke-width="14" fill="none" stroke-linecap="round"/>

  <!-- the road (dashed walking path) -->
  <path d="M170,430 C260,410 300,340 340,280 C376,228 430,190 500,180 C570,170 640,190 700,250 C730,282 740,330 730,380"
        stroke="#c98a3a" stroke-width="10" fill="none" stroke-linecap="round"/>
  <path d="M170,430 C260,410 300,340 340,280 C376,228 430,190 500,180 C570,170 640,190 700,250 C730,282 740,330 730,380"
        stroke="#fdf8ee" stroke-width="2.5" stroke-dasharray="10 12" fill="none"/>
  <text class="d" x="292" y="372" transform="rotate(-38 292 372)">vägen …</text>

  <!-- house by the lake -->
  <g transform="translate(160,452)">
    <rect x="-34" y="-30" width="68" height="34" fill="#8a3033" stroke="#5e1f22" stroke-width="2"/>
    <path d="M-40,-30 L0,-56 L40,-30 Z" fill="#7a5a4a"/>
    <rect x="-8" y="-18" width="16" height="22" fill="#5e1f22"/>
  </g>
  <text class="n" x="160" y="486">huset vid sjön</text>
  <text class="d" x="160" y="503">Här bor familjen Berg.</text>

  <!-- bridge over the stream -->
  <g transform="translate(346,262)">
    <path d="M-34,6 Q0,-22 34,6" stroke="#7a5a4a" stroke-width="9" fill="none"/>
    <line x1="-30" y1="6" x2="-30" y2="18" stroke="#7a5a4a" stroke-width="5"/>
    <line x1="30" y1="6" x2="30" y2="18" stroke="#7a5a4a" stroke-width="5"/>
  </g>
  <text class="n" x="330" y="312">bron</text>
  <text class="d" x="322" y="329">över vattnet!</text>

  <!-- shop -->
  <g transform="translate(500,158)">
    <rect x="-38" y="-26" width="76" height="34" fill="#e8c34a" stroke="#3a4550" stroke-width="2"/>
    <path d="M-42,-26 L42,-26 L34,-40 L-34,-40 Z" fill="#8a3033"/>
    <rect x="-10" y="-14" width="20" height="22" fill="#5e1f22"/>
  </g>
  <text class="n" x="500" y="130">affären</text>
  <text class="d" x="500" y="196">fru Eks affär 🏪</text>

  <!-- church -->
  <g transform="translate(636,232)">
    <rect x="-30" y="-24" width="60" height="34" fill="#fdf8ee" stroke="#3a4550" stroke-width="2"/>
    <rect x="-46" y="-52" width="20" height="62" fill="#fdf8ee" stroke="#3a4550" stroke-width="2"/>
    <path d="M-46,-52 L-36,-70 L-26,-52 Z" fill="#3a4550"/>
    <line x1="-36" y1="-70" x2="-36" y2="-80" stroke="#3a4550" stroke-width="2.5"/>
    <line x1="-41" y1="-75" x2="-31" y2="-75" stroke="#3a4550" stroke-width="2.5"/>
  </g>
  <text class="n" x="652" y="238">kyrkan</text>
  <text class="d" x="656" y="255">stor och vit ⛪</text>

  <!-- school -->
  <g transform="translate(724,410)">
    <rect x="-52" y="-36" width="104" height="46" fill="#c9605a" stroke="#5e1f22" stroke-width="2"/>
    <path d="M-58,-36 L0,-64 L58,-36 Z" fill="#7a5a4a"/>
    <rect x="-12" y="-16" width="24" height="26" fill="#5e1f22"/>
    <rect x="-40" y="-24" width="16" height="14" fill="#c9e2f0"/>
    <rect x="24" y="-24" width="16" height="14" fill="#c9e2f0"/>
  </g>
  <text class="n" x="722" y="444">skolan 🏫</text>
  <text class="d" x="708" y="461">Hit går barnen — varje morgon!</text>

  <!-- railway + station -->
  <line x1="60" y1="80" x2="740" y2="80" stroke="#3a4550" stroke-width="3"/>
  <g stroke="#3a4550" stroke-width="2">
    <line x1="80" y1="74" x2="80" y2="86"/><line x1="140" y1="74" x2="140" y2="86"/>
    <line x1="200" y1="74" x2="200" y2="86"/><line x1="260" y1="74" x2="260" y2="86"/>
    <line x1="320" y1="74" x2="320" y2="86"/><line x1="380" y1="74" x2="380" y2="86"/>
    <line x1="440" y1="74" x2="440" y2="86"/><line x1="640" y1="74" x2="640" y2="86"/>
    <line x1="700" y1="74" x2="700" y2="86"/>
  </g>
  <rect x="480" y="58" width="120" height="30" fill="#faf6ee" stroke="#3a4550" stroke-width="2"/>
  <text class="n" x="540" y="78">stationen 🚉</text>
  <text class="d" x="688" y="106">tåget → Stockholm!</text>

  <!-- walking children -->
  <g fill="#3a4550">
    <circle cx="252" cy="392" r="5"/><circle cx="268" cy="386" r="5"/><circle cx="284" cy="380" r="4"/>
  </g>
  <text class="d" x="240" y="422">Barnen går …</text>

  <!-- dog heading home -->
  <ellipse cx="386" cy="240" rx="16" ry="9" fill="#d9a441"/>
  <circle cx="401" cy="233" r="7" fill="#d9a441"/>
  <text class="d" x="398" y="216">– Ludde, gå hem!</text>
</svg>
