<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" font-family="'Source Sans 3','Segoe UI',sans-serif">
  <defs>
    <style>
      .land{stroke:#3a4550;stroke-width:2;stroke-linejoin:round}
      .lbl{fill:#3a4550;font-weight:700}
      .city{fill:#8a3033}
      .cl{fill:#3a4550;font-size:13px}
      .sea{fill:#4a7fae;font-style:italic;font-size:14px}
    </style>
  </defs>
  <rect width="800" height="560" fill="#dbe9f2"/>
  <rect x="6" y="6" width="788" height="548" fill="none" stroke="#8a3033" stroke-width="3"/>

  <!-- NORGE -->
  <path class="land" fill="#c9d8b8" d="M330,60 C300,90 280,150 285,210 C288,255 270,300 250,340 C240,362 250,378 275,370 C310,356 330,320 340,280 C352,236 360,180 372,130 C380,100 370,70 350,58 Z"/>
  <!-- SVERIGE -->
  <path class="land" fill="#f2dfa8" d="M372,130 C360,180 352,236 340,280 C332,320 330,360 336,400 C340,430 352,460 376,470 C400,478 420,462 428,430 C438,392 446,350 448,300 C450,240 440,180 420,130 C405,100 385,105 372,130 Z"/>
  <!-- FINLAND -->
  <path class="land" fill="#e6c9d0" d="M540,90 C520,130 512,190 520,240 C526,280 520,320 540,340 C565,358 600,345 612,305 C625,258 630,200 620,150 C612,110 590,80 565,78 C555,78 546,82 540,90 Z"/>
  <!-- DANMARK -->
  <path class="land" fill="#e8b88f" d="M300,455 C290,470 292,490 305,498 C320,505 335,495 338,478 C340,463 330,450 315,448 C309,448 304,450 300,455 Z"/>
  <ellipse class="land" fill="#e8b88f" cx="360" cy="482" rx="16" ry="11"/>
  <!-- ISLAND -->
  <ellipse class="land" fill="#cfe3d8" cx="105" cy="90" rx="52" ry="30"/>
  <!-- GOTLAND + ÖLAND -->
  <ellipse class="land" fill="#f2dfa8" cx="482" cy="392" rx="12" ry="20" transform="rotate(20 482 392)"/>
  <ellipse class="land" fill="#f2dfa8" cx="455" cy="416" rx="5" ry="16" transform="rotate(18 455 416)"/>

  <!-- lakes -->
  <ellipse fill="#4a7fae" cx="380" cy="392" rx="17" ry="12"/>
  <ellipse fill="#4a7fae" cx="408" cy="404" rx="8" ry="17"/>
  <text class="cl" x="330" y="380" font-style="italic" fill="#4a7fae">Vänern</text>
  <text class="cl" x="416" y="424" font-style="italic" fill="#4a7fae">Vättern</text>

  <!-- mountains -->
  <path fill="#3a4550" d="M382,150 l10,-16 10,16 Z"/>
  <text class="cl" x="398" y="146">Kebnekaise</text>
  <path fill="#3a4550" d="M318,205 l9,-14 9,14 Z"/>
  <text class="cl" x="212" y="186">Galdhøpiggen</text>

  <!-- country labels -->
  <text class="lbl" x="282" y="250" font-size="19" transform="rotate(-72 292 250)">NORGE</text>
  <text class="lbl" x="381" y="270" font-size="19" transform="rotate(-80 391 270)">SVERIGE</text>
  <text class="lbl" x="536" y="230" font-size="19" transform="rotate(-75 546 230)">FINLAND</text>
  <text class="lbl" x="268" y="527" font-size="15">DANMARK</text>
  <text class="lbl" x="70" y="72" font-size="15">ISLAND</text>

  <!-- cities -->
  <circle class="city" cx="440" cy="352" r="6"/><text class="cl" x="452" y="356" font-weight="700">Stockholm</text>
  <circle class="city" cx="352" cy="426" r="5"/><text class="cl" x="296" y="444">Göteborg</text>
  <circle class="city" cx="376" cy="466" r="5"/><text class="cl" x="384" y="480">Malmö</text>
  <circle class="city" cx="268" cy="352" r="5"/><text class="cl" x="228" y="344">Oslo</text>
  <circle class="city" cx="322" cy="480" r="5"/><text class="cl" x="216" y="486">Köpenhamn</text>
  <circle class="city" cx="548" cy="330" r="5"/><text class="cl" x="560" y="326">Helsingfors</text>

  <!-- Sjövik -->
  <path fill="#e8c34a" stroke="#8a3033" stroke-width="1.5" d="M404,441 l3.5,7.5 8,1 -5.8,5.7 1.4,8 -7.1,-3.8 -7.1,3.8 1.4,-8 -5.8,-5.7 8,-1 Z"/>
  <text class="cl" x="418" y="452" font-weight="700" fill="#8a3033">Sjövik!</text>

  <!-- seas -->
  <text class="sea" x="472" y="452">Östersjön</text>
  <text class="sea" x="186" y="420">Nordsjön</text>
  <text class="sea" x="60" y="180">Atlanten</text>

  <!-- compass -->
  <g transform="translate(710,90)">
    <line x1="0" y1="42" x2="0" y2="-42" stroke="#3a4550" stroke-width="3"/>
    <path fill="#8a3033" d="M0,-52 l9,18 -18,0 Z"/>
    <path fill="#4a7fae" d="M0,52 l9,-18 -18,0 Z"/>
    <text class="lbl" x="-18" y="-60" font-size="15">norr</text>
    <text class="lbl" x="-22" y="76" font-size="15">söder</text>
  </g>

  <!-- title -->
  <rect x="24" y="500" width="150" height="38" rx="6" fill="#faf6ee" stroke="#3a4550" stroke-width="2"/>
  <text class="lbl" x="46" y="526" font-size="20">NORDEN</text>
</svg>
