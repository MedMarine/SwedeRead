<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" font-family="'Source Sans 3','Segoe UI',sans-serif">
  <defs>
    <g id="p">
      <circle cx="0" cy="-26" r="14" fill="currentColor"/>
      <path d="M-16,26 C-16,-2 16,-2 16,26 Z" fill="currentColor"/>
    </g>
    <style>
      .n{fill:#3a4550;font-weight:700;font-size:15px;text-anchor:middle}
      .d{fill:#5a6b7a;font-size:12.5px;text-anchor:middle;font-style:italic}
      .ln{stroke:#3a4550;stroke-width:2;fill:none}
      .side{stroke:#8a3033;stroke-width:1.5;stroke-dasharray:5 4;fill:none}
    </style>
  </defs>
  <rect width="800" height="560" fill="#faf6ee"/>
  <rect x="6" y="6" width="788" height="548" fill="none" stroke="#8a3033" stroke-width="3"/>
  <text x="400" y="46" text-anchor="middle" font-size="24" font-weight="700" fill="#8a3033">FAMILJEN BERG</text>

  <!-- parents -->
  <use href="#p" x="330" y="130" color="#4a7fae"/>
  <text class="n" x="330" y="176">Anders</text><text class="d" x="330" y="192">pappa</text>
  <use href="#p" x="470" y="130" color="#8a3033"/>
  <text class="n" x="470" y="176">Karin</text><text class="d" x="470" y="192">mamma</text>
  <line class="ln" x1="348" y1="130" x2="452" y2="130"/>
  <text x="400" y="122" text-anchor="middle" font-size="13" fill="#8a3033">❤</text>

  <!-- drop to children -->
  <line class="ln" x1="400" y1="130" x2="400" y2="230"/>
  <line class="ln" x1="255" y1="230" x2="545" y2="230"/>
  <line class="ln" x1="255" y1="230" x2="255" y2="268"/>
  <line class="ln" x1="400" y1="230" x2="400" y2="268"/>
  <line class="ln" x1="545" y1="230" x2="545" y2="268"/>

  <!-- children -->
  <use href="#p" x="255" y="300" color="#c98a3a"/>
  <text class="n" x="255" y="346">Oskar</text><text class="d" x="255" y="362">son · tolv år</text>
  <use href="#p" x="400" y="300" color="#5f8f5a"/>
  <text class="n" x="400" y="346">Nils</text><text class="d" x="400" y="362">son · tio år</text>
  <g transform="translate(545,304) scale(0.85)">
    <use href="#p" color="#b0679a"/>
  </g>
  <text class="n" x="545" y="346">Astrid</text><text class="d" x="545" y="362">dotter · sju år</text>

  <!-- pets -->
  <g transform="translate(300,430)">
    <ellipse cx="0" cy="6" rx="28" ry="16" fill="#d9a441"/>
    <circle cx="30" cy="-6" r="12" fill="#d9a441"/>
    <path d="M24,-16 l4,-9 6,7 Z M36,-16 l4,-9 4,8 Z" fill="#b8842e"/>
    <path d="M-26,2 q-14,-8 -10,-20" stroke="#d9a441" stroke-width="6" fill="none" stroke-linecap="round"/>
  </g>
  <text class="n" x="305" y="474">Ludde</text><text class="d" x="305" y="490">hunden 🐕</text>
  <g transform="translate(455,436)">
    <ellipse cx="0" cy="4" rx="20" ry="12" fill="#8f9aa5"/>
    <circle cx="20" cy="-6" r="9" fill="#8f9aa5"/>
    <path d="M14,-12 l3,-7 4,5 Z M23,-13 l3,-7 3,6 Z" fill="#6e7a86"/>
    <path d="M-18,2 q-12,-4 -10,-16" stroke="#8f9aa5" stroke-width="4" fill="none" stroke-linecap="round"/>
  </g>
  <text class="n" x="455" y="474">Misse</text><text class="d" x="455" y="490">katten 🐈</text>

  <!-- side relatives -->
  <path class="side" d="M312,118 C220,90 160,110 118,140"/>
  <use href="#p" x="100" y="180" color="#7a6a8f"/>
  <text class="n" x="100" y="226">Ingrid — farmor</text>
  <text class="d" x="100" y="242">Anders mamma · Stockholm 🏙</text>

  <path class="side" d="M488,118 C580,90 640,110 682,140"/>
  <use href="#p" x="700" y="180" color="#6b7a4f"/>
  <text class="n" x="700" y="226">Sven — morfar</text>
  <text class="d" x="700" y="242">Karins pappa · en gård 🚜</text>

  <path class="side" d="M318,146 C210,240 150,300 112,352"/>
  <use href="#p" x="100" y="392" color="#3f6f9f"/>
  <text class="n" x="100" y="438">Lasse</text>
  <text class="d" x="100" y="454">Anders bror · på havet ⚓</text>
  <path d="M60,470 q10,-8 20,0 t20,0 t20,0 t20,0" stroke="#4a7fae" stroke-width="3" fill="none"/>

  <text class="d" x="660" y="430">en familj:</text>
  <text class="d" x="660" y="450">en mamma + en pappa</text>
  <text class="d" x="660" y="470">+ tre barn</text>
  <text class="d" x="660" y="490">+ en hund + en katt!</text>
</svg>
