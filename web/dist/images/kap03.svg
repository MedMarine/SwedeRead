<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" font-family="'Source Sans 3','Segoe UI',sans-serif">
  <style>
    .n{fill:#3a4550;font-weight:700;font-size:14px}
    .d{fill:#5a6b7a;font-size:12.5px;font-style:italic}
    .room{fill:#fdf8ee;stroke:#7a5a4a;stroke-width:2}
    .rl{fill:#8a3033;font-weight:700;font-size:13px;text-anchor:middle}
  </style>
  <rect width="800" height="560" fill="#dfeaf3"/>
  <rect x="6" y="6" width="788" height="548" fill="none" stroke="#8a3033" stroke-width="3"/>
  <text x="400" y="44" text-anchor="middle" font-size="24" font-weight="700" fill="#8a3033">HUSET VID SJÖN</text>

  <!-- ground + lake -->
  <rect x="6" y="440" width="788" height="114" fill="#a9c48a"/>
  <path d="M520,554 C540,470 640,450 794,462 L794,554 Z" fill="#4a7fae"/>
  <text class="n" x="640" y="530" fill="#fdf8ee">Björksjön</text>

  <!-- house body (cutaway) -->
  <rect x="80" y="200" width="400" height="240" fill="#8a3033" stroke="#5e1f22" stroke-width="3"/>
  <path d="M60,200 L280,110 L500,200 Z" fill="#7a5a4a" stroke="#5e1f22" stroke-width="3"/>
  <!-- attic bedrooms -->
  <rect class="room" x="120" y="205" width="105" height="70"/>
  <rect class="room" x="230" y="205" width="105" height="70"/>
  <rect class="room" x="340" y="205" width="105" height="70"/>
  <text class="rl" x="172" y="222">sovrum 1</text>
  <text class="rl" x="282" y="222">sovrum 2</text>
  <text class="rl" x="392" y="222">sovrum 3</text>
  <!-- beds -->
  <g stroke="#7a5a4a" stroke-width="1.5">
    <rect x="135" y="248" width="44" height="16" fill="#c9d8e8"/><rect x="135" y="244" width="12" height="10" fill="#fff"/>
    <rect x="248" y="248" width="44" height="16" fill="#c9d8e8"/><rect x="248" y="244" width="12" height="10" fill="#fff"/>
    <rect x="356" y="248" width="44" height="16" fill="#c9d8e8"/><rect x="356" y="244" width="12" height="10" fill="#fff"/>
  </g>
  <!-- cat in bed 3 -->
  <ellipse cx="388" cy="252" rx="9" ry="5" fill="#8f9aa5"/>
  <text class="d" x="404" y="242">Misse! 🐈</text>

  <!-- ground floor: kitchen + big room -->
  <rect class="room" x="120" y="290" width="160" height="140"/>
  <text class="rl" x="200" y="308">köket</text>
  <rect x="150" y="360" width="70" height="10" fill="#7a5a4a"/>
  <rect x="155" y="370" width="6" height="24" fill="#7a5a4a"/><rect x="209" y="370" width="6" height="24" fill="#7a5a4a"/>
  <rect x="132" y="366" width="12" height="28" fill="#c98a3a"/><rect x="226" y="366" width="12" height="28" fill="#c98a3a"/>
  <circle cx="185" cy="340" r="7" fill="#e8c34a"/><line x1="185" y1="347" x2="185" y2="360" stroke="#7a5a4a" stroke-width="2"/>
  <text class="d" x="150" y="425">bordet + fyra stolar</text>

  <rect class="room" x="290" y="290" width="155" height="140"/>
  <text class="rl" x="367" y="308">det stora rummet</text>
  <rect x="310" y="380" width="60" height="14" fill="#4a7fae"/>
  <rect x="390" y="350" width="34" height="44" fill="#7a5a4a"/><line x1="407" y1="350" x2="407" y2="394" stroke="#fdf8ee"/>
  <text class="d" x="386" y="420">böcker!</text>

  <!-- door + dog -->
  <rect x="452" y="360" width="26" height="80" fill="#5e1f22"/>
  <circle cx="458" cy="402" r="3" fill="#e8c34a"/>
  <text class="n" x="470" y="352">dörren</text>
  <ellipse cx="510" cy="432" rx="24" ry="13" fill="#d9a441"/>
  <circle cx="534" cy="422" r="10" fill="#d9a441"/>
  <text class="d" x="492" y="462">Ludde 🐕</text>

  <!-- window callout -->
  <rect x="86" y="310" width="26" height="30" fill="#c9e2f0" stroke="#fdf8ee" stroke-width="3"/>
  <text class="n" x="26" y="300">fönstret</text>
  <line x1="70" y1="304" x2="92" y2="312" stroke="#3a4550" stroke-width="1.5"/>

  <!-- garden + birch -->
  <text class="n" x="560" y="420">trädgården 🌷</text>
  <circle cx="562" cy="432" r="4" fill="#b0679a"/><circle cx="580" cy="436" r="4" fill="#e8c34a"/><circle cx="598" cy="430" r="4" fill="#8a3033"/>
  <rect x="640" y="300" width="14" height="130" fill="#f5f2ea" stroke="#3a4550" stroke-width="1"/>
  <g stroke="#3a4550" stroke-width="2"><line x1="641" y1="330" x2="649" y2="330"/><line x1="646" y1="366" x2="654" y2="366"/><line x1="641" y1="400" x2="649" y2="400"/></g>
  <ellipse cx="647" cy="266" rx="72" ry="52" fill="#7aa25a"/>
  <text class="n" x="606" y="200">björken 🌳</text>

  <!-- house label -->
  <text class="n" x="96" y="188">huset — det är rött!</text>
</svg>
