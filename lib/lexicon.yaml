# Svenska per se illustrata — the morphology ledger.
#
# Every lemma the book uses, with all inflected surface forms the linter should
# accept, a Swedish-first gloss (what the reader sees on tap), an optional English
# emergency-exit gloss, the chapter that introduces it (intro), and its tier:
#   focus | stretch | freebie | proper (proper nouns live in the `proper:` map)
#
# Conventions:
#   - keys are the dictionary citation form (substantiv: indefinite singular;
#     verb: infinitive; adjektiv: en-form)
#   - forms MUST include every surface the prose actually uses
#   - gloss_sv is written with vocabulary already unlocked at intro time wherever
#     possible; pictures/emoji may stand in where words would run ahead

lemmas:

  # ---------- step-0 freebies (kap 1) ----------
  och:      {pos: konjunktion, forms: [och], gloss_sv: "A och B = A + B", gloss_en: "and", intro: 1, tier: freebie}
  men:      {pos: konjunktion, forms: [men], gloss_sv: "A men inte B", gloss_en: "but", intro: 1, tier: freebie}
  inte:     {pos: adverb, forms: [inte], gloss_sv: "nej: är inte = ✗", gloss_en: "not", intro: 1, tier: freebie}
  också:    {pos: adverb, forms: [också], gloss_sv: "A är X. B är X också.", gloss_en: "also, too", intro: 1, tier: freebie}
  i:        {pos: preposition, forms: [i], gloss_sv: "Stockholm ligger i Sverige", gloss_en: "in", intro: 1, tier: freebie}
  vid:      {pos: preposition, forms: [vid], gloss_sv: "Sjövik ligger vid en sjö: 🏘️〰️ (inte i sjön!)", gloss_en: "by, next to", intro: 1, tier: freebie}
  med:      {pos: preposition, forms: [med], gloss_sv: "ett ord med fyra bokstäver: s-t-a-d", gloss_en: "with", intro: 1, tier: freebie}
  en:       {pos: artikel, forms: [en], gloss_sv: "en stad, en sjö (en-ord)", gloss_en: "a/an; one", intro: 1, tier: freebie}
  ett:      {pos: artikel, forms: [ett], gloss_sv: "ett land, ett hav (ett-ord)", gloss_en: "a/an; one", intro: 1, tier: freebie}
  vara:     {pos: verb, forms: [är, vara, var, varit], gloss_sv: "Sverige ÄR ett land (=). (var, varit: kapitel 15 och 18!)", gloss_en: "to be (är = is/are)", intro: 1, tier: freebie}
  var_q:    {pos: frågeord, forms: [var], gloss_sv: "Var ligger X? — X ligger i …", gloss_en: "where?", intro: 1, tier: freebie}
  vad:      {pos: frågeord, forms: [vad], gloss_sv: "Vad är X? — X är en …", gloss_en: "what?", intro: 1, tier: freebie}
  ja:       {pos: interjektion, forms: [ja], gloss_sv: "✓", gloss_en: "yes", intro: 1, tier: freebie}
  nej:      {pos: interjektion, forms: [nej], gloss_sv: "✗", gloss_en: "no", intro: 1, tier: freebie}
  eller:    {pos: konjunktion, forms: [eller], gloss_sv: "A eller B? Ja eller nej!", gloss_en: "or", intro: 1, tier: freebie}
  mycket:   {pos: adverb, forms: [mycket], gloss_sv: "mycket stor = stor stor stor!", gloss_en: "very; much", intro: 1, tier: freebie}
  många:    {pos: pronomen, forms: [många], gloss_sv: "många = 10, 20, 100 …", gloss_en: "many", intro: 1, tier: freebie}
  det:      {pos: pronomen, forms: [det], gloss_sv: "Vad är det? Det är en ö.", gloss_en: "it, that", intro: 1, tier: freebie}
  två:      {pos: räkneord, forms: [två], gloss_sv: "2", gloss_en: "two", intro: 1, tier: freebie}
  tre:      {pos: räkneord, forms: [tre], gloss_sv: "3", gloss_en: "three", intro: 1, tier: freebie}
  fyra:     {pos: räkneord, forms: [fyra], gloss_sv: "4", gloss_en: "four", intro: 1, tier: freebie}
  fem:      {pos: räkneord, forms: [fem], gloss_sv: "5", gloss_en: "five", intro: 1, tier: freebie}
  kapitel:  {pos: substantiv, gender: ett, forms: [kapitel, kapitlet, kapitlen], gloss_sv: "kapitel 1, kapitel 2, kapitel 3 … 📖", gloss_en: "chapter", intro: 1, tier: freebie}

  # ---------- kap 1 focus ----------
  land:
    pos: substantiv
    gender: ett
