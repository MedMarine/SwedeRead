  hur:      {pos: frågeord, forms: [hur], gloss_sv: "Hur många? — en, två, tre …", gloss_en: "how?", intro: 2, tier: freebie}
  hans:     {pos: pronomen, forms: [hans], gloss_sv: "hans = Oskars! (han → hans)", gloss_en: "his", intro: 2, tier: freebie}
  hennes:   {pos: pronomen, forms: [hennes], gloss_sv: "hennes katt = flickans katt (hon → hennes)", gloss_en: "her(s)", intro: 2, tier: freebie}
  på:       {pos: preposition, forms: [på], gloss_sv: "på Atlanten, på ett hav", gloss_en: "on", intro: 2, tier: freebie}
  sex:      {pos: räkneord, forms: [sex], gloss_sv: "6", gloss_en: "six", intro: 2, tier: freebie}
  sju:      {pos: räkneord, forms: [sju], gloss_sv: "7", gloss_en: "seven", intro: 2, tier: freebie}
  åtta:     {pos: räkneord, forms: [åtta], gloss_sv: "8", gloss_en: "eight", intro: 2, tier: freebie}
  nio:      {pos: räkneord, forms: [nio], gloss_sv: "9", gloss_en: "nine", intro: 2, tier: freebie}
  tio:      {pos: räkneord, forms: [tio], gloss_sv: "10", gloss_en: "ten", intro: 2, tier: freebie}
