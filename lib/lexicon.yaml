    gloss_en: "son"
    intro: 2
    tier: focus
  dotter:
    pos: substantiv
    gender: en
    forms: [dotter, dottern, döttrar, döttrarna, dotters, dotterns]
    gloss_sv: "Astrid är Anders och Karins dotter (flicka i familjen)"
    gloss_en: "daughter"
    intro: 2
    tier: focus
  hund:
    pos: substantiv
    gender: en
    forms: [hund, hunden, hundar, hundarna, hunds, hundens, hundars]
