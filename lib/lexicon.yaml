  år:
    pos: substantiv
    gender: ett
    forms: [år, året, åren, års, årets, årens]
    gloss_sv: "Astrid är sju år (7!). 1 år = januari → december."
    gloss_en: "year"
    intro: 2
    tier: stretch

  # ---------- kap 3 freebies ----------
  finnas:   {pos: verb, forms: [finns, finnas, fanns, funnits], gloss_sv: "det finns X i Y = X är i Y", gloss_en: "to exist, there is/are", intro: 3, tier: freebie}
  under:    {pos: preposition, forms: [under], gloss_sv: "⬇ Misse ligger under bordet", gloss_en: "under", intro: 3, tier: freebie}
  över:     {pos: preposition, forms: [över], gloss_sv: "⬆ lampan är över bordet", gloss_en: "over, above", intro: 3, tier: freebie}
  bakom:    {pos: preposition, forms: [bakom], gloss_sv: "← trädgården är bakom huset", gloss_en: "behind", intro: 3, tier: freebie}
